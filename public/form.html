<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply as Talent - ByP Solutions</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            600: '#4263eb',
                            800: '#1e3a8a',
                        },
                        accent: '#20c997',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Initialize Supabase client
        // IMPORTANT: Replace these with your actual Supabase credentials
        const SUPABASE_URL = 'https://pvnenwnfrjhvydnvdlaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_a_g7LglaqhY2hb2K1zz8Ug_ahZ_Lx_c';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function ApplicationForm() {
            const [formData, setFormData] = useState({
                full_name: '',
                role_type: '',
                category_id: '',
                summary: '',
                photo_url: '',
                media_intro_url: '',
                media_type: 'video',
            });

            const [experiences, setExperiences] = useState([{ company: '', role: '', duration: '' }]);
            const [education, setEducation] = useState([{ institution: '', degree: '', year: '' }]);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [showSuccessModal, setShowSuccessModal] = useState(false);
            const [error, setError] = useState('');

            const categories = [
                { id: 1, name: 'Sales & Marketing' },
                { id: 2, name: 'Customer Service' },
                { id: 3, name: 'Administrative' },
                { id: 4, name: 'Creative & Design' },
                { id: 5, name: 'Technical & IT' },
            ];

            const roleTypes = [
                'Appointment Setter',
                'Sales Development Rep',
                'Customer Success Manager',
                'Virtual Executive Assistant',
                'Social Media Manager',
                'Graphic Designer',
                'Data Entry Specialist',
                'Content Writer',
                'Project Manager',
                'Other',
            ];

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleExperienceChange = (index, field, value) => {
                const newExperiences = [...experiences];
                newExperiences[index][field] = value;
                setExperiences(newExperiences);
            };

            const addExperience = () => {
                setExperiences([...experiences, { company: '', role: '', duration: '' }]);
            };

            const removeExperience = (index) => {
                if (experiences.length > 1) {
                    setExperiences(experiences.filter((_, i) => i !== index));
                }
            };

            const handleEducationChange = (index, field, value) => {
                const newEducation = [...education];
                newEducation[index][field] = value;
                setEducation(newEducation);
            };

            const addEducation = () => {
                setEducation([...education, { institution: '', degree: '', year: '' }]);
            };

            const removeEducation = (index) => {
                if (education.length > 1) {
                    setEducation(education.filter((_, i) => i !== index));
                }
            };

            const validateForm = () => {
                if (!formData.full_name.trim()) return 'Full name is required';
                if (!formData.role_type) return 'Please select a role type';
                if (!formData.category_id) return 'Please select a category';
                if (!formData.summary.trim()) return 'Professional summary is required';
                if (formData.summary.trim().length < 50) return 'Professional summary must be at least 50 characters';
                
                const validExperiences = experiences.filter(exp => 
                    exp.company.trim() && exp.role.trim() && exp.duration.trim()
                );
                if (validExperiences.length === 0) return 'At least one complete work experience is required';
                
                const validEducation = education.filter(edu => 
                    edu.institution.trim() && edu.degree.trim() && edu.year.trim()
                );
                if (validEducation.length === 0) return 'At least one complete education entry is required';
                
                return null;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                const validationError = validateForm();
                if (validationError) {
                    setError(validationError);
                    return;
                }

                setIsSubmitting(true);

                try {
                    // Filter out incomplete entries
                    const validExperiences = experiences.filter(exp => 
                        exp.company.trim() && exp.role.trim() && exp.duration.trim()
                    );
                    
                    const validEducation = education.filter(edu => 
                        edu.institution.trim() && edu.degree.trim() && edu.year.trim()
                    );

                    // Prepare the payload with hardcoded status
                    const payload = {
                        full_name: formData.full_name.trim(),
                        role_type: formData.role_type,
                        category_id: parseInt(formData.category_id),
                        summary: formData.summary.trim(),
                        experience: validExperiences,
                        education: validEducation,
                        photo_url: formData.photo_url.trim() || null,
                        media_intro_url: formData.media_intro_url.trim() || null,
                        media_type: formData.media_type,
                        status: 'pending_review', // Hardcoded - candidates don't go live automatically
                    };

                    const { data, error: supabaseError } = await supabase
                        .from('candidates')
                        .insert([payload]);

                    if (supabaseError) throw supabaseError;

                    // Success! Show modal
                    setShowSuccessModal(true);
                    
                    // Reset form
                    setFormData({
                        full_name: '',
                        role_type: '',
                        category_id: '',
                        summary: '',
                        photo_url: '',
                        media_intro_url: '',
                        media_type: 'video',
                    });
                    setExperiences([{ company: '', role: '', duration: '' }]);
                    setEducation([{ institution: '', degree: '', year: '' }]);

                } catch (err) {
                    console.error('Submission error:', err);
                    let friendly = err.message || 'An error occurred while submitting your application. Please try again.';
                    if (/42501|row-level security|row level security|policy/i.test(friendly)) {
                        friendly = "Submission blocked by a Supabase RLS policy (PostgreSQL code 42501). Fix in Supabase: Table Editor -> candidates -> RLS -> add INSERT policy for the anon role (WITH CHECK true), OR run in SQL editor: create policy anon_insert_candidates on public.candidates for insert to anon with check (true);";
                    }
                    setError(friendly);
                } finally {
                    setIsSubmitting(false);
                }
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
                    {/* Header */}
                    <header className="bg-white shadow-sm">
                        <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                            <div className="flex items-center justify-between">
                                <a href="/" className="flex items-center space-x-2">
                                    <img src="/img/logo.jpg" alt="ByP Solutions" className="h-8 w-auto" />
                                    <span className="text-2xl font-bold text-brand-800">ByP Solutions</span>
                                </a>
                                <a href="/" className="text-gray-600 hover:text-brand-600 transition-colors">
                                    ← Back to Home
                                </a>
                            </div>
                        </div>
                    </header>

                    {/* Form Section */}
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
                        <div className="text-center mb-12">
                            <h1 className="text-4xl sm:text-5xl font-bold text-gray-900 mb-4">
                                Join Our Talent Network
                            </h1>
                            <p className="text-xl text-gray-600 max-w-2xl mx-auto">
                                We're always looking for exceptional virtual assistants to join our team. Complete the form below to get started.
                            </p>
                        </div>

                        <form onSubmit={handleSubmit} className="bg-white rounded-2xl shadow-xl p-8 sm:p-12">
                            {error && (
                                <div className="mb-6 bg-red-50 border border-red-200 rounded-lg p-4">
                                    <div className="flex items-start">
                                        <svg className="w-5 h-5 text-red-600 mr-2 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                            <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clipRule="evenodd" />
                                        </svg>
                                        <p className="text-red-800 text-sm">{error}</p>
                                    </div>
                                </div>
                            )}

                            {/* Basic Information */}
                            <div className="mb-8">
                                <h2 className="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                                    <svg className="w-6 h-6 text-brand-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                    </svg>
                                    Basic Information
                                </h2>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            Full Name *
                                        </label>
                                        <input
                                            type="text"
                                            name="full_name"
                                            value={formData.full_name}
                                            onChange={handleInputChange}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all"
                                            placeholder="John Doe"
                                            required
                                        />
                                    </div>

                                    <div className="grid sm:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Role Type *
                                            </label>
                                            <select
                                                name="role_type"
                                                value={formData.role_type}
                                                onChange={handleInputChange}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all"
                                                required
                                            >
                                                <option value="">Select a role...</option>
                                                {roleTypes.map(role => (
                                                    <option key={role} value={role}>{role}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Category *
                                            </label>
                                            <select
                                                name="category_id"
                                                value={formData.category_id}
                                                onChange={handleInputChange}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all"
                                                required
                                            >
                                                <option value="">Select a category...</option>
                                                {categories.map(cat => (
                                                    <option key={cat.id} value={cat.id}>{cat.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            Professional Summary * (minimum 50 characters)
                                        </label>
                                        <textarea
                                            name="summary"
                                            value={formData.summary}
                                            onChange={handleInputChange}
                                            rows={5}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all"
                                            placeholder="Tell us about your background, skills, and what makes you a great virtual assistant..."
                                            required
                                        />
                                        <p className="text-sm text-gray-500 mt-1">
                                            {formData.summary.length} characters
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* Experience */}
                            <div className="mb-8">
                                <h2 className="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                                    <svg className="w-6 h-6 text-brand-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                    </svg>
                                    Work Experience *
                                </h2>
                                
                                {experiences.map((exp, index) => (
                                    <div key={index} className="mb-6 p-6 bg-gray-50 rounded-lg border border-gray-200">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-lg font-semibold text-gray-700">
                                                Experience #{index + 1}
                                            </h3>
                                            {experiences.length > 1 && (
                                                <button
                                                    type="button"
                                                    onClick={() => removeExperience(index)}
                                                    className="text-red-600 hover:text-red-800 text-sm font-medium"
                                                >
                                                    Remove
                                                </button>
                                            )}
                                        </div>
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    Company Name
                                                </label>
                                                <input
                                                    type="text"
                                                    value={exp.company}
                                                    onChange={(e) => handleExperienceChange(index, 'company', e.target.value)}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent"
                                                    placeholder="Company Inc."
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    Role/Position
                                                </label>
                                                <input
                                                    type="text"
                                                    value={exp.role}
                                                    onChange={(e) => handleExperienceChange(index, 'role', e.target.value)}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent"
                                                    placeholder="Virtual Assistant"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    Duration
                                                </label>
                                                <input
                                                    type="text"
                                                    value={exp.duration}
                                                    onChange={(e) => handleExperienceChange(index, 'duration', e.target.value)}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent"
                                                    placeholder="Jan 2020 - Present"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                
                                <button
                                    type="button"
                                    onClick={addExperience}
                                    className="flex items-center text-brand-600 hover:text-brand-800 font-medium transition-colors"
                                >
                                    <svg className="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                    </svg>
                                    Add Another Experience
                                </button>
                            </div>

                            {/* Education */}
                            <div className="mb-8">
                                <h2 className="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                                    <svg className="w-6 h-6 text-brand-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                    </svg>
                                    Education *
                                </h2>
                                
                                {education.map((edu, index) => (
                                    <div key={index} className="mb-6 p-6 bg-gray-50 rounded-lg border border-gray-200">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-lg font-semibold text-gray-700">
                                                Education #{index + 1}
                                            </h3>
                                            {education.length > 1 && (
                                                <button
                                                    type="button"
                                                    onClick={() => removeEducation(index)}
                                                    className="text-red-600 hover:text-red-800 text-sm font-medium"
                                                >
                                                    Remove
                                                </button>
                                            )}
                                        </div>
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    Institution Name
                                                </label>
                                                <input
                                                    type="text"
                                                    value={edu.institution}
                                                    onChange={(e) => handleEducationChange(index, 'institution', e.target.value)}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent"
                                                    placeholder="University Name"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    Degree/Certification
                                                </label>
                                                <input
                                                    type="text"
                                                    value={edu.degree}
                                                    onChange={(e) => handleEducationChange(index, 'degree', e.target.value)}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent"
                                                    placeholder="Bachelor's in Business Administration"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">
                                                    Year Completed
                                                </label>
                                                <input
                                                    type="text"
                                                    value={edu.year}
                                                    onChange={(e) => handleEducationChange(index, 'year', e.target.value)}
                                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent"
                                                    placeholder="2020"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                
                                <button
                                    type="button"
                                    onClick={addEducation}
                                    className="flex items-center text-brand-600 hover:text-brand-800 font-medium transition-colors"
                                >
                                    <svg className="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                                    </svg>
                                    Add Another Education
                                </button>
                            </div>

                            {/* Media & Portfolio */}
                            <div className="mb-8">
                                <h2 className="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                                    <svg className="w-6 h-6 text-brand-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                    </svg>
                                    Media & Portfolio (Optional)
                                </h2>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            Profile Photo URL
                                        </label>
                                        <input
                                            type="url"
                                            name="photo_url"
                                            value={formData.photo_url}
                                            onChange={handleInputChange}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all"
                                            placeholder="https://example.com/photo.jpg"
                                        />
                                        <p className="text-sm text-gray-500 mt-1">
                                            Link to a professional headshot (LinkedIn, Google Drive, etc.)
                                        </p>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            Video/Audio Introduction Type
                                        </label>
                                        <div className="flex gap-4">
                                            <label className="flex items-center">
                                                <input
                                                    type="radio"
                                                    name="media_type"
                                                    value="video"
                                                    checked={formData.media_type === 'video'}
                                                    onChange={handleInputChange}
                                                    className="mr-2"
                                                />
                                                <span className="text-gray-700">Video (Loom)</span>
                                            </label>
                                            <label className="flex items-center">
                                                <input
                                                    type="radio"
                                                    name="media_type"
                                                    value="audio"
                                                    checked={formData.media_type === 'audio'}
                                                    onChange={handleInputChange}
                                                    className="mr-2"
                                                />
                                                <span className="text-gray-700">Audio (Vocaroo)</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">
                                            {formData.media_type === 'video' ? 'Loom' : 'Vocaroo'} Introduction URL
                                        </label>
                                        <input
                                            type="url"
                                            name="media_intro_url"
                                            value={formData.media_intro_url}
                                            onChange={handleInputChange}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all"
                                            placeholder={formData.media_type === 'video' ? 'https://loom.com/share/...' : 'https://vocaroo.com/...'}
                                        />
                                        <p className="text-sm text-gray-500 mt-1">
                                            Record a brief introduction about yourself and why you'd be a great fit
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* Submit Button */}
                            <div className="flex items-center justify-between pt-6 border-t border-gray-200">
                                <p className="text-sm text-gray-500">
                                    * Required fields
                                </p>
                                <button
                                    type="submit"
                                    disabled={isSubmitting}
                                    className={`flex items-center px-8 py-4 rounded-lg font-semibold text-lg transition-all shadow-lg ${
                                        isSubmitting
                                            ? 'bg-gray-400 cursor-not-allowed'
                                            : 'bg-brand-600 hover:bg-brand-800 text-white hover:shadow-xl'
                                    }`}
                                >
                                    {isSubmitting ? (
                                        <>
                                            <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                            </svg>
                                            Submitting...
                                        </>
                                    ) : (
                                        <>
                                            Submit Application
                                            <svg className="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7l5 5m0 0l-5 5m5-5H6" />
                                            </svg>
                                        </>
                                    )}
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* Success Modal */}
                    {showSuccessModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 transform transition-all">
                                <div className="text-center">
