<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Talent Bench - ByP Solutions</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#4263eb',
                            600: '#4263eb',
                            800: '#1e3a8a',
                        },
                        accent: '#20c997',
                        slate: {
                            deep: '#0f172a',
                            clean: '#f8fafc',
                        }
                    },
                    letterSpacing: {
                        widest: '0.12em',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .flip-card {
            perspective: 1000px;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s ease-in-out;
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front,
        .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
        }
        .flip-card-front {
            background-color: #f8fafc;
        }
        .flip-card-back {
            background-color: #f8fafc;
            transform: rotateY(180deg);
        }
        .gradient-badge {
            background: linear-gradient(135deg, #4263eb 0%, #20c997 100%);
        }
        .media-preview-enter {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .quiz-collapse {
            transition: all 0.5s ease-in-out;
            overflow: hidden;
        }
        .locked-overlay {
            backdrop-filter: blur(2px);
        }
        .pricing-sticky {
            position: sticky;
            top: 88px;
            z-index: 30;
        }
    </style>
</head>
<body class="bg-slate-clean">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const SUPABASE_URL = 'https://pvnenwnfrjhvydnvdlaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_a_g7LglaqhY2hb2K1zz8Ug_ahZ_Lx_c';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const CATEGORIES = [
            { id: 'all', name: 'All Talent' },
            { id: 1, name: 'Sales & Marketing' },
            { id: 2, name: 'Customer Service' },
            { id: 3, name: 'Administrative' },
            { id: 4, name: 'Creative & Design' },
            { id: 5, name: 'Technical & IT' },
        ];

        const PRICING_TIERS = [
            {
                id: 'general',
                name: 'General Virtual Assistant',
                rate: 4.50,
                description: 'Inbox management, basic data entry, scheduling, customer support.',
            },
            {
                id: 'video',
                name: 'Video Editors',
                rate: 5.00,
                description: 'Short-form clipping, transitions, color grading, multi-platform formatting.',
            },
            {
                id: 'specialized',
                name: 'Specialized Assistant',
                rate: 5.50,
                description: 'CRM optimization, project coordination, advanced research workflows.',
            },
            {
                id: 'ai',
                name: 'AI-Augmented Specialist',
                rate: 6.00,
                description: 'Advanced multi-tool AI scraping, automated content repurposing, workflows via Make/Airtable.',
            },
            {
                id: 'elite',
                name: 'Elite Technical / Developer',
                rate: 15.00,
                description: 'GoHighLevel platform development, QuickBooks accounting, full-scale web development.',
            },
        ];

        const QUIZ_BOTTLENECKS = [
            { id: 'leads', label: 'Scaling Lead Generation & Outbound Outreach', categories: [1] },
            { id: 'content', label: 'High-Volume Content Creation & Video Editing', categories: [4] },
            { id: 'admin', label: 'Inbox, Scheduling & General Admin Overwhelm', categories: [3, 2] },
            { id: 'technical', label: 'Advanced Technical Setup, CRM (GHL) & Automation Architecture', categories: [5] },
        ];

        const QUIZ_CAPACITY = [
            { id: 'parttime', label: 'Part-Time Focus (~20 Hours/Week)' },
            { id: 'fulltime', label: 'Full-Time Power (~40 Hours/Week) — Includes 10% Bundle Discount' },
            { id: 'unsure', label: 'Not Sure Yet / Scaling Up' },
        ];

        const QUIZ_TOOLS = [
            { id: 'ghl', label: 'GoHighLevel', keywords: ['gohighlevel', 'ghl', 'highlevel'] },
            { id: 'qb', label: 'QuickBooks', keywords: ['quickbooks', 'accounting'] },
            { id: 'pm', label: 'ClickUp/Notion', keywords: ['clickup', 'notion', 'project'] },
            { id: 'shopify', label: 'Shopify', keywords: ['shopify', 'ecommerce', 'e-commerce'] },
            { id: 'ai', label: 'Active AI Tools (ChatGPT, Claude, Clay, Midjourney, etc.)', keywords: ['chatgpt', 'claude', 'clay', 'midjourney', 'ai'] },
            { id: 'workspace', label: 'Standard Meta/Google Workspace', keywords: ['google', 'workspace', 'meta', 'facebook'] },
        ];

        const BOOKING_SLOTS = [
            '9:00 AM', '10:00 AM', '11:00 AM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM'
        ];

        function formatRate(rate) {
            return rate.toFixed(2);
        }

        function applyDiscount(rate, isFullTime) {
            return isFullTime ? rate * 0.9 : rate;
        }

        function talentMatchesTools(talent, selectedTools) {
            if (!selectedTools || selectedTools.length === 0) return true;
            const haystack = [
                talent.role_type,
                talent.summary,
                ...(Array.isArray(talent.tags) ? talent.tags : []),
                ...(Array.isArray(talent.skills) ? talent.skills : []),
            ].join(' ').toLowerCase();

            return selectedTools.some(toolId => {
                const tool = QUIZ_TOOLS.find(t => t.id === toolId);
                if (!tool) return false;
                return tool.keywords.some(kw => haystack.includes(kw));
            });
        }

        function talentMatchesBottleneck(talent, bottleneckId) {
            if (!bottleneckId) return true;
            const bottleneck = QUIZ_BOTTLENECKS.find(b => b.id === bottleneckId);
            if (!bottleneck) return true;
            return bottleneck.categories.includes(talent.category_id);
        }

        function isAvailableWithin48Hours(talent) {
            const tags = Array.isArray(talent.tags) ? talent.tags : [];
            const tagMatch = tags.some(tag =>
                String(tag).toLowerCase().includes('48') ||
                String(tag).toLowerCase().includes('available') ||
                String(tag).toLowerCase() === 'available_48h'
            );
            if (tagMatch) return true;
            if (talent.available_within_48h === true) return true;
            const status = String(talent.availability_status || '').toLowerCase();
            return status.includes('48') || status === 'available';
        }

        function PricingTierBanner({ isFullTime, onToggleCapacity, language }) {
            const [showTooltip, setShowTooltip] = useState(false);

            const t = language === 'es' ? {
                title: 'Paquetes de Agencia Todo Incluido',
                subtitle: 'Tarifas por hora del paquete gestionado — no freelancers aislados',
                partTime: 'Medio Tiempo (Estándar)',
                fullTime: 'Tiempo Completo (Ahorra 10%)',
                retainer: 'Todos los paquetes operan con retainer prepagado por adelantado para asegurar su especialista dedicado.',
                includes: 'Incluye: horas de agente dedicado, gestión de QA, monitoreo continuo y cobertura de respaldo instantánea.',
                perHour: '/hr',
                tooltip: 'La tarifa por hora cubre únicamente el tiempo de ejecución del especialista. Las suscripciones de software o claves API premium se manejan por separado. Los clientes pueden proporcionar sus propias credenciales o optar por un paquete de credenciales aislado provisto por la agencia, facturado por separado.',
            } : {
                title: 'All-Inclusive Agency Service Packages',
                subtitle: 'Managed bundle hourly rates — not isolated, risky freelancers',
                partTime: 'Part-Time (Standard)',
                fullTime: 'Full-Time (Save 10%)',
                retainer: 'All agency packages operate on a prepaid retainer model, billed upfront to lock in your dedicated specialist.',
                includes: 'Includes: dedicated agent hours, quality assurance management, continuous monitoring, and instant backup coverage.',
                perHour: '/hr',
                tooltip: 'The hourly rate covers the specialist\'s execution time only. Software tool subscriptions or premium API keys are handled separately. Clients may either provide their own workspace credentials directly or opt for an isolated, agency-provisioned credential package billed separately.',
            };

            return (
                <div className="pricing-sticky mb-8">
                    <div className="bg-slate-deep rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-700/50">
                        <div className="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-6 mb-6">
                            <div>
                                <h2 className="text-xl sm:text-2xl font-bold text-white mb-2 tracking-wide">{t.title}</h2>
                                <p className="text-slate-300 text-sm tracking-wider uppercase">{t.subtitle}</p>
                                <p className="text-slate-400 text-sm mt-3 leading-relaxed">{t.includes}</p>
                            </div>
                            <div className="flex-shrink-0">
                                <div className="flex items-center bg-slate-800/80 rounded-xl p-1 border border-slate-600">
                                    <button
                                        onClick={() => onToggleCapacity(false)}
                                        className={`px-4 py-2.5 rounded-lg text-sm font-semibold transition-all duration-300 ease-in-out tracking-wide ${
                                            !isFullTime ? 'bg-brand-600 text-white shadow-lg' : 'text-slate-400 hover:text-white'
                                        }`}
                                    >
                                        {t.partTime}
                                    </button>
                                    <button
                                        onClick={() => onToggleCapacity(true)}
                                        className={`px-4 py-2.5 rounded-lg text-sm font-semibold transition-all duration-300 ease-in-out tracking-wide ${
                                            isFullTime ? 'bg-accent text-white shadow-lg' : 'text-slate-400 hover:text-white'
                                        }`}
                                    >
                                        {t.fullTime}
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="grid sm:grid-cols-2 lg:grid-cols-5 gap-3">
                            {PRICING_TIERS.map(tier => {
                                const displayRate = applyDiscount(tier.rate, isFullTime);
                                return (
                                    <div
                                        key={tier.id}
                                        className="bg-slate-800/60 rounded-xl p-4 border border-slate-700/40 hover:border-brand-600/50 transition-all duration-300 ease-in-out hover:shadow-lg"
                                    >
                                        <div className="text-xs font-semibold text-accent uppercase tracking-widest mb-1">{tier.name}</div>
                                        <div className="flex items-baseline gap-1 mb-2">
                                            <span className="text-2xl font-bold text-white">${formatRate(displayRate)}</span>
                                            <span className="text-slate-400 text-sm">{t.perHour}</span>
                                        </div>
                                        {isFullTime && (
                                            <div className="text-xs text-emerald-400 line-through text-slate-500 mb-1">${formatRate(tier.rate)}{t.perHour}</div>
                                        )}
                                        <p className="text-xs text-slate-400 leading-relaxed">{tier.description}</p>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="mt-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                            <p className="text-xs text-slate-400 tracking-wide">{t.retainer}</p>
                            <div className="relative">
                                <button
                                    onMouseEnter={() => setShowTooltip(true)}
                                    onMouseLeave={() => setShowTooltip(false)}
                                    onClick={() => setShowTooltip(!showTooltip)}
                                    className="text-xs text-brand-500 hover:text-accent underline decoration-dotted tracking-wide transition-all duration-300"
                                >
                                    {language === 'es' ? 'Nota sobre herramientas y API' : 'Tool & API subscription note'}
                                </button>
                                {showTooltip && (
                                    <div className="absolute bottom-full right-0 mb-2 w-72 sm:w-80 bg-white text-slate-deep text-xs p-4 rounded-xl shadow-xl border border-slate-200 z-50 leading-relaxed">
                                        <em>{t.tooltip}</em>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function TalentMatchQuiz({ talents, quizState, setQuizState, onComplete, onCapacityChange, language }) {
            const { step, bottleneck, capacity, tools, leadForm, isCollapsed } = quizState;

            const t = language === 'es' ? {
                title: 'Quiz de Coincidencia de Talento',
                subtitle: '60 segundos para encontrar su especialista ideal',
                step1: '¿Cuál es su principal cuello de botella operativo?',
                step2: '¿Cuántas horas de ejecución dedicada requiere su negocio semanalmente?',
                step3: '¿Qué herramientas principales quiere que gestione su Agente Dedicado?',
                step4Prefix: 'Hemos encontrado exactamente',
                step4Suffix: 'especialistas premium en nuestro bench listos para desplegar.',
                firstName: 'Nombre',
                workEmail: 'Email de Trabajo',
                phone: 'Teléfono',
                cta: 'Desbloquear Mi Coincidencia de Talento',
                next: 'Continuar',
                back: 'Atrás',
                matches: 'Sus Coincidencias',
                bottleneck: 'Cuello de botella',
                capacityLabel: 'Capacidad',
                toolsLabel: 'Herramientas',
            } : {
                title: 'Talent Match Quiz',
                subtitle: '60 seconds to find your ideal specialist match',
                step1: 'What is your primary operational bottleneck right now?',
                step2: 'How many hours of dedicated execution does your business require weekly?',
                step3: 'Which primary tools do you want your Dedicated Agent to manage?',
                step4Prefix: 'We have found exactly',
                step4Suffix: 'matching premium specialists on our bench ready to deploy.',
                firstName: 'First Name',
                workEmail: 'Work Email',
                phone: 'Phone Number',
                cta: 'Unlock My Tailored Talent Bench Match',
                next: 'Continue',
                back: 'Back',
                matches: 'Your Matches',
                bottleneck: 'Bottleneck',
                capacityLabel: 'Capacity',
                toolsLabel: 'Tools',
            };

            const matchCount = useMemo(() => {
                return talents.filter(talent =>
                    talentMatchesBottleneck(talent, bottleneck) &&
                    talentMatchesTools(talent, tools)
                ).length;
            }, [talents, bottleneck, tools]);

            const canProceed = () => {
                if (step === 1) return !!bottleneck;
                if (step === 2) return !!capacity;
                if (step === 3) return tools.length > 0;
                if (step === 4) return leadForm.firstName && leadForm.email && leadForm.phone;
                return false;
            };

            const handleNext = () => {
                if (step < 4) setQuizState(prev => ({ ...prev, step: prev.step + 1 }));
            };

            const handleBack = () => {
                if (step > 1) setQuizState(prev => ({ ...prev, step: prev.step - 1 }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!canProceed()) return;
                onComplete({ bottleneck, capacity, tools, leadForm });
                setQuizState(prev => ({ ...prev, isCollapsed: true }));
            };

            const toggleTool = (toolId) => {
                setQuizState(prev => ({
                    ...prev,
                    tools: prev.tools.includes(toolId)
                        ? prev.tools.filter(id => id !== toolId)
                        : [...prev.tools, toolId],
                }));
            };

            if (isCollapsed) {
                const bottleneckLabel = QUIZ_BOTTLENECKS.find(b => b.id === bottleneck)?.label || '';
                const capacityLabel = QUIZ_CAPACITY.find(c => c.id === capacity)?.label || '';
                const toolLabels = tools.map(id => QUIZ_TOOLS.find(tool => tool.id === id)?.label).filter(Boolean);

                return (
                    <div className="mb-8 bg-white rounded-2xl shadow-xl border border-slate-200 p-5 transition-all duration-300 ease-in-out">
                        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-full gradient-badge flex items-center justify-center">
                                    <svg className="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                                    </svg>
                                </div>
                                <div>
                                    <h3 className="font-bold text-slate-deep tracking-wide">{t.matches}</h3>
                                    <p className="text-sm text-slate-500 tracking-wider">
                                        <span className="font-semibold text-brand-600">{matchCount}</span> {language === 'es' ? 'especialistas coinciden' : 'specialists match your stack'}
                                    </p>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                <span className="px-3 py-1 bg-slate-100 text-xs font-medium text-slate-600 rounded-full tracking-widest uppercase">
                                    {bottleneckLabel.split(' ').slice(0, 3).join(' ')}…
                                </span>
                                <span className="px-3 py-1 bg-brand-600/10 text-xs font-medium text-brand-600 rounded-full tracking-widest">
                                    {capacityLabel.split('(')[0].trim()}
                                </span>
                                {toolLabels.slice(0, 2).map((label, i) => (
                                    <span key={i} className="px-3 py-1 bg-accent/10 text-xs font-medium text-emerald-700 rounded-full tracking-widest">
                                        {label.split('/')[0].trim()}
                                    </span>
                                ))}
                                {toolLabels.length > 2 && (
                                    <span className="px-3 py-1 bg-slate-100 text-xs font-medium text-slate-500 rounded-full tracking-widest">
                                        +{toolLabels.length - 2}
                                    </span>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="mb-10 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden transition-all duration-300 ease-in-out">
                    <div className="bg-slate-deep px-6 py-5">
                        <div className="flex items-center justify-between">
                            <div>
                                <h2 className="text-xl font-bold text-white tracking-wide">{t.title}</h2>
                                <p className="text-slate-400 text-sm tracking-widest uppercase mt-1">{t.subtitle}</p>
                            </div>
                            <div className="flex gap-1.5">
                                {[1, 2, 3, 4].map(s => (
                                    <div
                                        key={s}
                                        className={`w-8 h-1.5 rounded-full transition-all duration-300 ${
                                            s <= step ? 'bg-accent' : 'bg-slate-600'
                                        }`}
                                    />
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="p-6 sm:p-8">
                        {step === 1 && (
                            <div>
                                <h3 className="text-lg font-semibold text-slate-deep mb-5 tracking-wide">{t.step1}</h3>
                                <div className="space-y-3">
                                    {QUIZ_BOTTLENECKS.map(option => (
                                        <label
                                            key={option.id}
                                            className={`flex items-start gap-4 p-4 rounded-xl border-2 cursor-pointer transition-all duration-300 ease-in-out ${
                                                bottleneck === option.id
                                                    ? 'border-brand-600 bg-brand-600/5 shadow-md'
                                                    : 'border-slate-200 hover:border-slate-300 hover:shadow-sm'
                                            }`}
                                        >
                                            <input
                                                type="radio"
                                                name="bottleneck"
                                                checked={bottleneck === option.id}
                                                onChange={() => setQuizState(prev => ({ ...prev, bottleneck: option.id }))}
                                                className="mt-1 w-4 h-4 text-brand-600"
                                            />
                                            <span className="text-slate-700 text-sm leading-relaxed">{option.label}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div>
                                <h3 className="text-lg font-semibold text-slate-deep mb-5 tracking-wide">{t.step2}</h3>
                                <div className="space-y-3">
                                    {QUIZ_CAPACITY.map(option => (
                                        <label
                                            key={option.id}
                                            className={`flex items-start gap-4 p-4 rounded-xl border-2 cursor-pointer transition-all duration-300 ease-in-out ${
                                                capacity === option.id
                                                    ? 'border-brand-600 bg-brand-600/5 shadow-md'
                                                    : 'border-slate-200 hover:border-slate-300 hover:shadow-sm'
                                            }`}
                                        >
                                            <input
                                                type="radio"
                                                name="capacity"
                                                checked={capacity === option.id}
                                                onChange={() => {
                                                    setQuizState(prev => ({ ...prev, capacity: option.id }));
                                                    if (onCapacityChange) {
                                                        onCapacityChange(option.id === 'fulltime');
                                                    }
                                                }}
                                                className="mt-1 w-4 h-4 text-brand-600"
                                            />
                                            <span className="text-slate-700 text-sm leading-relaxed">{option.label}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div>
                                <h3 className="text-lg font-semibold text-slate-deep mb-5 tracking-wide">{t.step3}</h3>
                                <div className="grid sm:grid-cols-2 gap-3">
                                    {QUIZ_TOOLS.map(option => (
                                        <label
                                            key={option.id}
                                            className={`flex items-center gap-3 p-4 rounded-xl border-2 cursor-pointer transition-all duration-300 ease-in-out ${
                                                tools.includes(option.id)
                                                    ? 'border-accent bg-accent/5 shadow-md'
                                                    : 'border-slate-200 hover:border-slate-300 hover:shadow-sm'
                                            }`}
                                        >
                                            <input
                                                type="checkbox"
                                                checked={tools.includes(option.id)}
                                                onChange={() => toggleTool(option.id)}
                                                className="w-4 h-4 text-accent rounded"
                                            />
                                            <span className="text-slate-700 text-sm">{option.label}</span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        )}

                        {step === 4 && (
                            <form onSubmit={handleSubmit}>
                                <h3 className="text-lg font-semibold text-slate-deep mb-2 tracking-wide">
                                    {t.step4Prefix}{' '}
                                    <span className="text-brand-600">{matchCount}</span>{' '}
                                    {t.step4Suffix}
                                </h3>
                                <p className="text-sm text-slate-500 mb-6 tracking-wide">
                                    {language === 'es'
                                        ? 'Complete sus datos para desbloquear el bench completo.'
                                        : 'Complete your details to unlock the full active bench.'}
                                </p>
                                <div className="grid sm:grid-cols-3 gap-4 mb-6">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-2 tracking-widest uppercase">{t.firstName}</label>
                                        <input
                                            type="text"
                                            required
                                            value={leadForm.firstName}
                                            onChange={(e) => setQuizState(prev => ({
                                                ...prev,
                                                leadForm: { ...prev.leadForm, firstName: e.target.value }
                                            }))}
                                            className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all duration-300"
                                            placeholder="Jane"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 mb-2 tracking-widest uppercase">{t.workEmail}</label>
                                        <input
                                            type="email"
                                            required
                                            value={leadForm.email}
                                            onChange={(e) => setQuizState(prev => ({
                                                ...prev,
                                                leadForm: { ...prev.leadForm, email: e.target.value }
                                            }))}
                                            className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all duration-300"
                                            placeholder="jane@company.com"

        function InstantBookingFlow({ talent, language, onClose }) {

                confirm: 'Confirmar Reserva',

                confirmedMsg: 'Recibirá un enlace de calendario en su email en breve.',
                name: 'Su Nombre',
                email: 'Su Email',
                next: 'Siguiente',
                back: 'Atrás',
            } : {
                title: 'Instantly Book Interview with',
                step1: 'Select a date',
                step2: 'Select a time slot',
                step3: 'Confirm your details',
                confirm: 'Confirm Booking',
                confirmed: 'Interview Booked!',
                confirmedMsg: 'You will receive a calendar invite at your email shortly.',
                name: 'Your Name',
                email: 'Your Email',
                next: 'Next',
                back: 'Back',
            };

            const upcomingDates = useMemo(() => {
                const dates = [];
                const today = new Date();
                for (let i = 1; i <= 10; i++) {
                    const d = new Date(today);
                    d.setDate(today.getDate() + i);
                    if (d.getDay() !== 0 && d.getDay() !== 6) {
                        dates.push(d.toISOString().split('T')[0]);
                    }
                }
                return dates.slice(0, 7);
            }, []);

            const formatDate = (dateStr) => {
                const d = new Date(dateStr + 'T12:00:00');
                return d.toLocaleDateString(language === 'es' ? 'es-ES' : 'en-US', {
                    weekday: 'short', month: 'short', day: 'numeric'
                });
            };

            if (confirmed) {
                return (
                    <div className="text-center py-4">
                        <div className="w-14 h-14 rounded-full bg-accent/20 flex items-center justify-center mx-auto mb-3">
                            <svg className="w-7 h-7 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                        </svg>
                        {t.title} {talent.full_name.split(' ')[0]}
                    </h4>

                    <div className="flex gap-1 mb-4">
                        {[1, 2, 3].map(s => (
                            <div key={s} className={`flex-1 h-1 rounded-full transition-all duration-300 ${s <= bookingStep ? 'bg-accent' : 'bg-slate-200'}`} />

                    {bookingStep === 1 && (

                                    <button
                                        key={date}
                                        onClick={() => { setSelectedDate(date); setBookingStep(2); }}

                                            selectedDate === date
                                                ? 'border-accent bg-accent/10 text-emerald-800'
                                                : 'border-slate-200 hover:border-brand-600 text-slate-600'
                                        }`}
                                    >
                                        {formatDate(date)}
                                    </button>
                                ))}
                            </div>

                    {bookingStep === 2 && (

        function isDirectMediaUrl(url) {
            if (!url) return false;
            return /\.(mp4|webm|ogg|mov)(\?|$)/i.test(url) || url.startsWith('blob:');
        }

        function isEmbedUrl(url) {
            if (!url) return false;
            return /youtube|youtu\.be|vimeo|embed/i.test(url);
        }

                    {isLocked && (

                        </div>
                    )}
                </div>
            );
        }

        function TalentBench() {
            const [talents, setTalents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [language, setLanguage] = useState('en');
            const [showInterviewModal, setShowInterviewModal] = useState(false);
            const [selectedTalent, setSelectedTalent] = useState(null);
            const [quizCompleted, setQuizCompleted] = useState(false);
            const [pricingFullTime, setPricingFullTime] = useState(false);
            const [quizState, setQuizState] = useState({
                step: 1,
                bottleneck: '',
                capacity: '',
                tools: [],
                leadForm: { firstName: '', email: '', phone: '' },
                isCollapsed: false,
            });
            const [quizFilters, setQuizFilters] = useState(null);

            useEffect(() => {
                fetchTalents();
            }, []);

            const fetchTalents = async () => {
                setLoading(true);
                setError('');

                try {
                    const { data, error: supabaseError } = await supabase
                        .from('public_talent_bench')
                        .select('*')
                        .order('full_name', { ascending: true });

                    if (supabaseError) throw supabaseError;

                    setTalents(data || []);
                } catch (err) {
                    console.error('Error fetching talents:', err);
                    setError('Failed to load talent data. Please try again later.');
                } finally {
                    setLoading(false);
                }
            };

            const handleQuizComplete = useCallback((data) => {
                setQuizCompleted(true);
                setQuizFilters(data);
                if (data.capacity === 'fulltime') {
                    setPricingFullTime(true);
                }
            }, []);

            const filteredTalents = useMemo(() => {
                return talents.filter(talent => {
                    const matchesSearch =
                        talent.full_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        talent.role_type.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        talent.summary.toLowerCase().includes(searchTerm.toLowerCase());

                    const matchesCategory = selectedCategory === 'all' || talent.category_id === selectedCategory;

                    let matchesQuiz = true;
                    if (quizCompleted && quizFilters) {
                        matchesQuiz =
                            talentMatchesBottleneck(talent, quizFilters.bottleneck) &&
                            talentMatchesTools(talent, quizFilters.tools);
                    }

                    return matchesSearch && matchesCategory && matchesQuiz;
                });
            }, [talents, searchTerm, selectedCategory, quizCompleted, quizFilters]);

            const handleRequestInterview = (talent) => {
                setSelectedTalent(talent);
                setShowInterviewModal(true);
            };

            const t = language === 'es' ? {
                title: 'Bench de Talento Premium',
                subtitle: 'Paquetes de agencia todo incluido con especialistas bilingües verificados',
                searchPlaceholder: 'Buscar por nombre, rol o habilidades...',
                resultsFound: 'especialistas premium encontrados',
                loading: 'Cargando talento...',
                error: 'Error',
                retry: 'Reintentar',
                noResults: 'No se encontró talento',
                tryAdjusting: 'Intenta ajustar tu búsqueda o filtros',
                scheduleInterview: 'Programar Entrevista',
                close: 'Cerrar',
                contactInfo: 'Información de Contacto',
                yourName: 'Tu Nombre',
                yourEmail: 'Tu Email',
                yourPhone: 'Teléfono (Opcional)',
                message: 'Mensaje (Opcional)',
                send: 'Enviar Solicitud',
            } : {
                title: 'Premium Talent Bench',
                subtitle: 'All-inclusive agency bundles with vetted, bilingual specialists ready to deploy',
                searchPlaceholder: 'Search by name, role, or skills...',
                resultsFound: 'premium specialists found',
                loading: 'Loading talent...',
                error: 'Error',
                retry: 'Retry',
                noResults: 'No talent found',
                tryAdjusting: 'Try adjusting your search or filters',
                scheduleInterview: 'Schedule Interview',
                close: 'Close',
                contactInfo: 'Contact Information',
                yourName: 'Your Name',
                yourEmail: 'Your Email',
                yourPhone: 'Phone Number (Optional)',
                message: 'Message (Optional)',
                send: 'Send Request',
            };

            return (
                <div className="min-h-screen bg-slate-clean">
                    {/* Header */}
                    <header className="bg-slate-deep shadow-xl sticky top-0 z-40">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
                            <div className="flex items-center justify-between mb-4">
                                <a href="/" className="flex items-center space-x-2 group">
                                    <svg className="w-8 h-8 text-accent group-hover:text-white transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                    </svg>
                                    <span className="text-2xl font-bold text-white tracking-wide">ByP Solutions</span>
                                </a>

                                <div className="flex items-center space-x-2 bg-slate-800 rounded-xl p-1 border border-slate-700">
                                    <button
                                        onClick={() => setLanguage('en')}
                                        className={`px-4 py-2 rounded-lg font-medium transition-all duration-300 ease-in-out tracking-wide ${
                                            language === 'en'
                                                ? 'bg-brand-600 text-white shadow-lg'
                                                : 'text-slate-400 hover:text-white'
                                        }`}
                                    >
                                        EN
                                    </button>
                                    <button
                                        onClick={() => setLanguage('es')}
                                        className={`px-4 py-2 rounded-lg font-medium transition-all duration-300 ease-in-out tracking-wide ${
                                            language === 'es'
                                                ? 'bg-brand-600 text-white shadow-lg'
                                                : 'text-slate-400 hover:text-white'
                                        }`}
                                    >
                                        ES
                                    </button>
                                </div>
                            </div>

                            <div className="text-center">
                                <h1 className="text-3xl sm:text-4xl font-bold text-white mb-2 tracking-wide">
                                    {t.title}
                                </h1>
                                <p className="text-lg text-slate-400 tracking-wider">
                                    {t.subtitle}
                                </p>
                            </div>
                        </div>
                    </header>

                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {/* Talent Match Quiz */}
                        <TalentMatchQuiz
                            talents={talents}
                            quizState={quizState}
                            setQuizState={setQuizState}
                            onComplete={handleQuizComplete}
                            onCapacityChange={setPricingFullTime}
                            language={language}
                        />

                        {/* Pricing Tier Banner */}
                        <PricingTierBanner
                            isFullTime={pricingFullTime}
                            onToggleCapacity={setPricingFullTime}
                            language={language}
                        />

                        {/* Search Bar */}
                        <div className="mb-6">
                            <div className="relative">
                                <svg className="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                </svg>
                                <input
                                    type="text"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    placeholder={t.searchPlaceholder}
                                    className="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all duration-300 ease-in-out shadow-sm"
                                />
                            </div>
                        </div>

                        {/* Category Pills */}
                        <div className="flex flex-wrap gap-3 mb-6">
                            {CATEGORIES.map(cat => (
                                <button
                                    key={cat.id}
                                    onClick={() => setSelectedCategory(cat.id)}
                                    className={`px-6 py-2 rounded-full font-medium transition-all duration-300 ease-in-out tracking-widest text-sm uppercase ${
                                        selectedCategory === cat.id
                                            ? 'gradient-badge text-white shadow-xl'
                                            : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200 hover:shadow-md'
                                    }`}
                                >
                                    {cat.name}
                                </button>
                            ))}
                        </div>

                        {!loading && !error && (
                            <div className="mb-6 text-center">
                                <p className="text-slate-500 tracking-wide">
                                    <span className="font-bold text-brand-600 text-xl">{filteredTalents.length}</span> {t.resultsFound}
                                </p>
                            </div>
                        )}

                        {loading && (
                            <div className="text-center py-20">
                                <div className="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-brand-600 mb-4"></div>
                                <p className="text-slate-500 text-lg tracking-wide">{t.loading}</p>
                            </div>
                        )}

                        {error && (
                            <div className="max-w-md mx-auto text-center py-20">
                                <div className="bg-red-50 border border-red-200 rounded-2xl p-6 shadow-xl">
                                    <svg className="w-12 h-12 text-red-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <h3 className="text-lg font-bold text-red-900 mb-2">{t.error}</h3>
                                    <p className="text-red-700 mb-4">{error}</p>
                                    <button
                                        onClick={fetchTalents}
                                        className="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-xl font-semibold transition-all duration-300"
                                    >
                                        {t.retry}
                                    </button>
                                </div>
                            </div>
                        )}

                        {!loading && !error && filteredTalents.length === 0 && (
                            <div className="text-center py-20">
                                <svg className="w-24 h-24 text-slate-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <h3 className="text-2xl font-bold text-slate-deep mb-2">{t.noResults}</h3>
                                <p className="text-slate-500">{t.tryAdjusting}</p>
                            </div>
                        )}

                        {!loading && !error && filteredTalents.length > 0 && (
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {filteredTalents.map((talent, index) => (
                                    <TalentCard
                                        key={talent.id}
                                        talent={talent}
                                        language={language}
                                        onRequestInterview={handleRequestInterview}
                                        isLocked={!quizCompleted && index >= 3}
                                        index={index}
                                    />
                                ))}
                            </div>
                        )}
                    </div>

                    {showInterviewModal && selectedTalent && (
                        <div className="fixed inset-0 bg-slate-deep/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8">
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h3 className="text-2xl font-bold text-slate-deep mb-1 tracking-wide">
                                            {t.scheduleInterview}
                                        </h3>
                                        <p className="text-slate-500">
                                            {selectedTalent.full_name} — {selectedTalent.role_type}
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setShowInterviewModal(false)}
                                        className="text-slate-400 hover:text-slate-600 transition-all duration-300"
                                    >
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>

                                <form className="space-y-4" onSubmit={(e) => { e.preventDefault(); setShowInterviewModal(false); }}>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-600 mb-2 tracking-widest uppercase">
                                            {t.yourName} *
                                        </label>
                                        <input
                                            type="text"
                                            required
                                            className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all duration-300"
                                            placeholder="John Doe"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-slate-600 mb-2 tracking-widest uppercase">
                                            {t.yourEmail} *
                                        </label>
                                        <input
                                            type="email"
                                            required
                                            className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all duration-300"
                                            placeholder="john@company.com"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-slate-600 mb-2 tracking-widest uppercase">
                                            {t.yourPhone}
                                        </label>
                                        <input
                                            type="tel"
                                            className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all duration-300"
                                            placeholder="+1 (555) 123-4567"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-slate-600 mb-2 tracking-widest uppercase">
                                            {t.message}
                                        </label>
                                        <textarea
                                            rows={4}
                                            className="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-600 focus:border-transparent transition-all duration-300"
                                            placeholder="Tell us about your needs and availability..."
                                        />
                                    </div>

                                    <div className="flex gap-3 pt-4">
                                        <button
                                            type="button"
                                            onClick={() => setShowInterviewModal(false)}
                                            className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 px-6 py-3 rounded-xl font-semibold transition-all duration-300"
                                        >
                                            {t.close}
                                        </button>
                                        <button
                                            type="submit"
                                            className="flex-1 bg-accent hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-semibold transition-all duration-300 shadow-xl"
                                        >
                                            {t.send}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<TalentBench />, document.getElementById('root'));
    </script>
</body>
</html>
