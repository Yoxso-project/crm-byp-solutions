        function AmbientBackground() {
            return (
                <div className="fixed inset-0 overflow-hidden pointer-events-none z-0" aria-hidden="true">
                    <div className="orb w-[300px] sm:w-[420px] h-[300px] sm:h-[420px] bg-pastel-lavender -top-20 -left-20 animate-float" />
                    <div className="orb w-[250px] sm:w-[360px] h-[250px] sm:h-[360px] bg-pastel-mint top-1/3 -right-20 animate-float-delayed" />
                    <div className="orb w-[200px] sm:w-[280px] h-[200px] sm:h-[280px] bg-pastel-blush bottom-20 left-1/4 animate-float" style={{ animationDelay: '1.5s' }} />
                </div>
            );
        }

        function FadeIn({ children, delay = 0, className = '' }) {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const observer = new IntersectionObserver(
                    ([entry]) => { if (entry.isIntersecting) { setVisible(true); observer.disconnect(); } },
                    { threshold: 0.08, rootMargin: '0px 0px -20px 0px' }
                );
                observer.observe(el);
                return () => observer.disconnect();
            }, []);
            return (
                <div ref={ref} className={`${visible ? 'fade-visible' : 'fade-hidden'} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        }

        function TrustStrip({ language }) {
            const items = language === 'es'
                ? ['100% Verificados', 'Bilingües EN/ES', 'Agencia Gestionada', 'Despliegue en 48h']
                : ['Fully Vetted', 'Bilingual EN/ES', 'Agency-Managed', '48hr Deploy'];
            return (
                <div className="flex flex-wrap justify-center gap-2 sm:gap-4 mb-8 px-2">
                    {items.map((item, i) => (
                        <div key={item} className="flex items-center gap-1.5 px-3 sm:px-4 py-1.5 sm:py-2 rounded-full glass-panel shadow-soft text-[10px] sm:text-xs font-medium text-ink-muted tracking-luxury uppercase" style={{ animationDelay: `${i * 100}ms` }}>
                            <span className="w-1.5 h-1.5 rounded-full bg-pastel-sage status-dot" />
                            {item}
                        </div>
                    ))}
                </div>
            );
        }

        function LeadHero({ language, onStartQuiz, quizCompleted, isQuizOpen }) {
            const t = language === 'es' ? {
                eyebrow: 'Sin compromiso · 60 segundos',
                title: 'Encuentre su especialista ideal',
                subtitle: '¿No sabe por dónde empezar? Le mostramos el equipo perfecto para su negocio sin dolores de cabeza técnicos.',
                cta: 'Comenzar Match Inteligente',
                skip: 'O explore los perfiles destacados abajo',
            } : {
                eyebrow: 'No commitment · 60 seconds',
                title: 'Find your perfect specialist',
                subtitle: 'Not sure where to start? We\'ll match you with the right team for your business — no technical expertise required.',
                cta: 'Start Smart Match',
                skip: 'Or browse featured profiles below',
            };

            if (quizCompleted) return null;

            return (
                <FadeIn className="text-center mb-8 px-4">
                    <p className="text-[10px] sm:text-xs font-semibold text-pastel-lilac tracking-widest uppercase mb-3">{t.eyebrow}</p>
                    <h2 className="text-3xl sm:text-4xl md:text-5xl font-semibold text-ink mb-4 tracking-tight leading-tight">
                        {t.title.split(' ').slice(0, -2).join(' ')}<br className="hidden sm:block" />{' '}
                        <span className="gradient-text">{t.title.split(' ').slice(-2).join(' ')}</span>
                    </h2>
                    <p className="text-ink-muted max-w-xl mx-auto text-sm sm:text-base leading-relaxed mb-8">
                        {t.subtitle}
                    </p>
                    
                    {!isQuizOpen && (
                        <div className="animate-scale-in">
                            <button onClick={onStartQuiz} className="btn-premium text-white w-full sm:w-auto px-8 py-4 rounded-full font-semibold text-sm tracking-luxury shadow-soft-lg flex items-center justify-center mx-auto gap-2">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                                </svg>
                                {t.cta}
                            </button>
                            <p className="text-ink-light text-xs mt-5 tracking-wide">{t.skip}</p>
                        </div>
                    )}
                </FadeIn>
            );
        }

        function formatRate(rate) { return rate.toFixed(2); }
        function applyDiscount(rate, isFullTime) { return isFullTime ? rate * 0.9 : rate; }
        
        function talentMatchesTools(talent, selectedTools) {
            if (!selectedTools || selectedTools.length === 0) return true;
            const haystack = [talent.role_type, talent.summary, ...(Array.isArray(talent.tags) ? talent.tags : []), ...(Array.isArray(talent.skills) ? talent.skills : [])].join(' ').toLowerCase();
            return selectedTools.some(toolId => {
                const tool = QUIZ_TOOLS.find(t => t.id === toolId);
                return tool && tool.keywords.some(kw => haystack.includes(kw));
            });
        }

        function talentMatchesBottleneck(talent, bottleneckId) {
            if (!bottleneckId) return true;
            const bottleneck = QUIZ_BOTTLENECKS.find(b => b.id === bottleneckId);
            return bottleneck ? bottleneck.categories.includes(talent.category_id) : true;
        }

        function isAvailableWithin48Hours(talent) {
            const tags = Array.isArray(talent.tags) ? talent.tags : [];
            const tagMatch = tags.some(tag => String(tag).toLowerCase().includes('48') || String(tag).toLowerCase() === 'available_48h');
            if (tagMatch || talent.available_within_48h === true) return true;
            return String(talent.availability_status || '').toLowerCase().includes('48');
        }

        function TalentMatchQuiz({ talents, quizState, setQuizState, onComplete, onCapacityChange, language, quizRef, isQuizOpen, onCloseQuiz }) {
            const { step, bottleneck, capacity, tools, leadForm, isCollapsed } = quizState;

            // Don't render full DOM if not open and not completed to save resources, but handle collapse state
            if (!isQuizOpen && !isCollapsed) return null;

            const t = language === 'es' ? {
                title: 'Búsqueda Inteligente',
                subtitle: 'Paso',
                of: 'de',
                step1: '¿Qué área necesita resolver con más urgencia?',
                step1hint: 'Seleccione lo que más le preocupa hoy.',
                step2: '¿Cuánto apoyo semanal estima necesitar?',
                step2hint: 'Podrá ajustar esto más adelante.',
                step3: '¿Qué herramientas usa principalmente?',
                step3hint: 'Seleccione todas las que apliquen.',
                step4Prefix: '¡Excelente! Encontramos',
                step4Suffix: 'especialistas listos para usted.',
                step4hint: 'Ingrese sus datos para ver su bench personalizado. Cero spam.',
                firstName: 'Nombre',
                workEmail: 'Email',
                phone: 'Teléfono',
                cta: 'Ver Mi Equipo Ideal',
                next: 'Siguiente',
                back: 'Atrás',
                matches: 'Sus Coincidencias',
                close: 'Cerrar',
            } : {
                title: 'Smart Match',
                subtitle: 'Step',
                of: 'of',
                step1: 'What area requires the most urgent help?',
                step1hint: 'Pick what feels most pressing right now.',
                step2: 'How much weekly support do you estimate needing?',
                step2hint: 'You can easily adjust this later.',
                step3: 'Which core tools do you use?',
                step3hint: 'Select all that apply.',
                step4Prefix: 'Great! We found',
                step4Suffix: 'specialists ready for you.',
                step4hint: 'Enter your details to unlock your personalized bench. Zero spam.',
                firstName: 'First Name',
                workEmail: 'Work Email',
                phone: 'Phone Number',
                cta: 'See My Ideal Team',
                next: 'Next',
                back: 'Back',
                matches: 'Your Matches',
                close: 'Close',
            };

            const matchCount = useMemo(() => {
                return talents.filter(t => talentMatchesBottleneck(t, bottleneck) && talentMatchesTools(t, tools)).length;
            }, [talents, bottleneck, tools]);

            const canProceed = () => {
                if (step === 1) return !!bottleneck;
                if (step === 2) return !!capacity;
                if (step === 3) return tools.length > 0;
                if (step === 4) return leadForm.firstName && leadForm.email && leadForm.phone;
                return false;
            };

            const handleNext = () => { if (step < 4) setQuizState(prev => ({ ...prev, step: prev.step + 1 })); };
            const handleBack = () => { if (step > 1) setQuizState(prev => ({ ...prev, step: prev.step - 1 })); };
            const handleSubmit = (e) => {
                e.preventDefault();
                if (!canProceed()) return;
                onComplete({ bottleneck, capacity, tools, leadForm });
                setQuizState(prev => ({ ...prev, isCollapsed: true }));
            };

            const toggleTool = (toolId) => {
                setQuizState(prev => ({ ...prev, tools: prev.tools.includes(toolId) ? prev.tools.filter(id => id !== toolId) : [...prev.tools, toolId] }));
            };

            if (isCollapsed) {
                const bottleneckLabel = QUIZ_BOTTLENECKS.find(b => b.id === bottleneck)?.label || '';
                const capacityLabel = QUIZ_CAPACITY.find(c => c.id === capacity)?.label || '';
                const toolLabels = tools.map(id => QUIZ_TOOLS.find(tool => tool.id === id)?.label).filter(Boolean);

                return (
                    <div ref={quizRef} className="mb-8 glass-panel rounded-3xl shadow-soft-lg p-4 sm:p-5 mx-4 sm:mx-0 animate-scale-in">
                        <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

                                    </svg>
                                </div>
                                <div>
                                    <h3 className="font-semibold text-ink tracking-tight">{t.matches}</h3>
                                    <p className="text-sm text-ink-muted">
                                        <span className="font-semibold text-pastel-lilac">{matchCount}</span> {language === 'es' ? 'especialistas listos' : 'specialists ready'}
                                    </p>
                                </div>
                            </div>
                            <div className="flex flex-wrap gap-2">
                                <span className="px-3 py-1.5 bg-pastel-lavender text-[10px] sm:text-[11px] font-medium text-pastel-lilac rounded-full tracking-luxury truncate max-w-[150px] sm:max-w-none">
                                    {bottleneckLabel.split(' ').slice(0, 3).join(' ')}…
                                </span>
                                <span className="px-3 py-1.5 bg-pastel-mint text-[10px] sm:text-[11px] font-medium text-pastel-sage rounded-full tracking-luxury">
                                    {capacityLabel.split('(')[0].trim()}
                                </span>
                            </div>
                        </div>
                    </div>
                );
            }

            const stepHints = { 1: t.step1hint, 2: t.step2hint, 3: t.step3hint, 4: t.step4hint };
            const stepTitles = { 1: t.step1, 2: t.step2, 3: t.step3 };
            const optionClass = (selected) => `flex items-start gap-3 p-3.5 sm:p-4 rounded-2xl border cursor-pointer transition-all duration-300 ease-in-out ${selected ? 'border-pastel-lilac/50 bg-white/90 shadow-soft' : 'border-white/80 bg-white/40 hover:bg-white/70 hover:shadow-soft'}`;

            return (
                <div ref={quizRef} className="mb-10 mx-4 sm:mx-0 glass-panel rounded-3xl shadow-soft-lg overflow-hidden drawer-enter border border-white/60">
                    <div className="px-5 py-4 border-b border-white/60 flex items-center justify-between bg-white/30">
                        <div>
                            <h2 className="text-base sm:text-lg font-semibold text-ink tracking-tight">{t.title}</h2>
                            <p className="text-[10px] sm:text-xs text-ink-muted tracking-luxury mt-0.5 uppercase">{t.subtitle} {step} {t.of} 4</p>
                        </div>
                        <div className="flex items-center gap-4">

                                                <div className="mb-2">
                                                    <h4 className="text-[10px] font-semibold text-ink-muted mb-2 uppercase tracking-widest">{t.education}</h4>
                                                    <div className="space-y-1.5">
                                                        {talent.education.map((edu, idx) => (
                                                            <div key={idx} className="bg-pastel-mint/30 p-2.5 rounded-xl border border-white/50">
                                                                <div className="font-medium text-xs text-ink">{edu.degree}</div>
                                                                <div className="text-[10px] text-ink-muted">{edu.institution} • {edu.year}</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </>
                                    ) : (
                                        <InstantBookingFlow talent={talent} language={language} onClose={() => setShowBooking(false)} />
                                    )}
                                </div>

                                {!showBooking && (
                                    <div className="pt-3 border-t border-white/50 mt-auto shrink-0">
                                        <button onClick={(e) => { e.stopPropagation(); setShowBooking(true); }} className="w-full bg-pastel-sage text-white py-2.5 rounded-xl text-xs font-semibold shadow-soft hover:opacity-90 transition-opacity">
                                            {language === 'es' ? 'Agendar Llamada Ya' : 'Schedule Call Now'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {isLocked && (
                        <div className="absolute inset-0 z-20 rounded-3xl flex items-center justify-center cursor-pointer p-4" onClick={onUnlockClick}>
                            <div className="absolute inset-0 rounded-3xl bg-white/30 backdrop-blur-sm" />
                            <div className="relative z-30 text-center glass-panel rounded-2xl p-5 shadow-soft-lg w-full max-w-[240px] pointer-events-auto border border-white">
                                <div className="w-10 h-10 rounded-full bg-pastel-lavender flex items-center justify-center mx-auto mb-3 shadow-sm">
                                    <svg className="w-4 h-4 text-pastel-lilac" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                                </div>
                                <p className="text-[11px] text-ink-muted leading-relaxed mb-4">{t.unlockMsg}</p>
                                <span className="inline-block bg-pastel-lilac text-white text-[10px] font-semibold px-4 py-2 rounded-full tracking-widest shadow-sm">
                                    {t.unlockCta}
                                </span>
                            </div>
                        </div>
                    )}
                </FadeIn>
            );
        }

        function ZeroResultsCTA({ language, onRequestCustom }) {
            const t = language === 'es' ? {
                title: 'No encontramos coincidencias exactas en nuestra vista pública.',
                desc: 'Pero no se preocupe. Tenemos una base de datos privada más extensa. Solicite el perfil específico que necesita y nuestro equipo de reclutamiento lo encontrará y presentará en menos de 48 horas.',
                btn: 'Solicitar Búsqueda Personalizada (48h)',
            } : {
                title: 'No exact matches found in our public bench.',
                desc: 'Don\'t worry. We have a larger private network. Request the specific profile you need, and our dedicated recruiting team will source and present them to you within 48 hours.',
                btn: 'Request Custom Search (48h)',
            };

            return (
                <FadeIn className="max-w-2xl mx-auto px-4 w-full">
                    <div className="glass-panel rounded-[2rem] p-8 sm:p-10 text-center shadow-soft-lg border border-white/80 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-pastel-blush rounded-full filter blur-3xl opacity-50 -translate-y-1/2 translate-x-1/2"></div>
                        <div className="absolute bottom-0 left-0 w-24 h-24 bg-pastel-lavender rounded-full filter blur-2xl opacity-50 translate-y-1/2 -translate-x-1/2"></div>
                        
                        <div className="relative z-10">
                            <div className="w-14 h-14 rounded-full bg-pastel-lavender flex items-center justify-center mx-auto mb-5 shadow-sm">
                                <svg className="w-6 h-6 text-pastel-lilac" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
                                </svg>
                            </div>
                            <h3 className="text-xl sm:text-2xl font-semibold text-ink mb-3 tracking-tight">{t.title}</h3>
                            <p className="text-ink-muted text-sm leading-relaxed mb-8 max-w-lg mx-auto">{t.desc}</p>
                            <button onClick={onRequestCustom} className="btn-premium text-white px-6 sm:px-8 py-3.5 sm:py-4 rounded-full font-semibold text-sm tracking-luxury shadow-soft-lg w-full sm:w-auto">
                                {t.btn}
                            </button>
                        </div>
                    </div>
                </FadeIn>
            );
        }

        function TalentBench() {
            const [talents, setTalents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [language, setLanguage] = useState('en');
            
            // Modal states
            const [showModal, setShowModal] = useState(false);
            const [modalMode, setModalMode] = useState('interview'); // 'interview' or 'custom'
            const [selectedTalent, setSelectedTalent] = useState(null);
            
            // Quiz states
            const [isQuizOpen, setIsQuizOpen] = useState(false);
            const [quizCompleted, setQuizCompleted] = useState(false);
            const [pricingFullTime, setPricingFullTime] = useState(false);
            const [quizState, setQuizState] = useState({ step: 1, bottleneck: '', capacity: '', tools: [], leadForm: { firstName: '', email: '', phone: '' }, isCollapsed: false });
            const [quizFilters, setQuizFilters] = useState(null);
            const [pricingExpanded, setPricingExpanded] = useState(false);
            const quizRef = useRef(null);

            const openQuiz = useCallback(() => {
                setIsQuizOpen(true);
                setTimeout(() => quizRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
            }, []);

            useEffect(() => {
                if(supabase) fetchTalents();
                else {
                    setLoading(false);
                    setError('Database connection error.');
                }
            }, []);

            const fetchTalents = async () => {
                setLoading(true); setError('');
                try {
                    const { data, error: supabaseError } = await supabase.from('public_talent_bench').select('*').order('full_name', { ascending: true });
                    if (supabaseError) throw supabaseError;
                    setTalents(data || []);
                } catch (err) {
                    console.error('Error:', err);
                    // Provide mock data if DB fails so UI can be evaluated
                    setTalents([
                        { id: 1, full_name: 'Elena R.', role_type: 'Bilingual V.A.', summary: 'Expert in inbox management and scheduling.', category_id: 3, available_within_48h: true, tags: ['admin'] },
                        { id: 2, full_name: 'Carlos M.', role_type: 'GoHighLevel Expert', summary: 'Building complex automations and funnels.', category_id: 5, available_within_48h: false, tags: ['ghl'] },
                        { id: 3, full_name: 'Sofia T.', role_type: 'Video Editor', summary: 'Short form content for TikTok and Reels.', category_id: 4, available_within_48h: true, tags: ['video'] },
                    ]);
                } finally { setLoading(false); }
            };

            const handleQuizComplete = useCallback((data) => {
                setQuizCompleted(true); setQuizFilters(data);
                if (data.capacity === 'fulltime') setPricingFullTime(true);
            }, []);

            const filteredTalents = useMemo(() => {
                return talents.filter(talent => {
                    const matchesSearch = talent.full_name.toLowerCase().includes(searchTerm.toLowerCase()) || talent.role_type.toLowerCase().includes(searchTerm.toLowerCase()) || talent.summary.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesCategory = selectedCategory === 'all' || talent.category_id === selectedCategory;
                    let matchesQuiz = true;
                    if (quizCompleted && quizFilters) {
                        matchesQuiz = talentMatchesBottleneck(talent, quizFilters.bottleneck) && talentMatchesTools(talent, quizFilters.tools);
                    }
                    return matchesSearch && matchesCategory && matchesQuiz;
                });
            }, [talents, searchTerm, selectedCategory, quizCompleted, quizFilters]);

            const handleRequestInterview = (talent) => {
                setSelectedTalent(talent); setModalMode('interview'); setShowModal(true);
            };

            const handleCustomRequest = () => {
                setSelectedTalent(null); setModalMode('custom'); setShowModal(true);
            };

            const t = language === 'es' ? {
                title: 'Talent Bench', subtitle: 'Especialistas verificados, listos para desplegar en su negocio',
                searchPlaceholder: 'Buscar rol o habilidad...', resultsFound: 'especialistas disponibles',
                loading: 'Cargando talento...', error: 'Error', retry: 'Reintentar',
                scheduleInterview: 'Programar Entrevista', customRequestTitle: 'Búsqueda Personalizada (48h)',
                close: 'Cancelar', send: 'Enviar Solicitud',
            } : {
                title: 'Talent Bench', subtitle: 'Vetted specialists, ready to deploy into your business',
                searchPlaceholder: 'Search role or skill...', resultsFound: 'specialists available',
                loading: 'Loading talent...', error: 'Error', retry: 'Retry',
                scheduleInterview: 'Schedule Interview', customRequestTitle: 'Custom Search Request (48h)',
                close: 'Cancel', send: 'Send Request',
            };

            return (
                <div className="min-h-screen bg-cream relative selection:bg-pastel-lilac/30 selection:text-brand-800 pb-20">
                    <AmbientBackground />

                    <header className="glass-panel sticky top-0 z-40 border-b border-white/60 shadow-sm transition-all duration-300">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-3">
                            <div className="flex items-center justify-between">
                                <a href="/" className="flex items-center gap-3 group">
                                    <div className="bg-white rounded-xl shadow-sm p-1 transition-transform duration-300 group-hover:scale-105 border border-white/50">
                                        <img src="https://bypsolutions.netlify.app/img/logo.jpg" alt="ByP Solutions Logo" className="h-7 sm:h-9 w-auto rounded-lg object-contain" onerror="this.style.display='none'" />
                                        <svg className="w-7 h-7 text-pastel-lilac hidden fallback-svg" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                                    </div>
                                    <span className="hidden sm:block text-lg font-semibold text-ink tracking-tight">ByP Solutions</span>
                                </a>

                                <div className="flex items-center bg-pastel-lavender/50 rounded-full p-1 border border-white/40">
                                    {['en', 'es'].map(lang => (
                                        <button key={lang} onClick={() => setLanguage(lang)}
                                            className={`px-3 sm:px-4 py-1 sm:py-1.5 rounded-full text-[10px] sm:text-xs font-medium transition-all duration-300 tracking-luxury uppercase ${language === lang ? 'bg-white text-pastel-lilac shadow-soft' : 'text-ink-muted hover:text-ink'}`}>
                                            {lang}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="relative z-10 max-w-6xl mx-auto pt-8 sm:pt-12 pb-16">
                        <LeadHero language={language} onStartQuiz={openQuiz} quizCompleted={quizCompleted} isQuizOpen={isQuizOpen} />
                        
                        <TrustStrip language={language} />

                        <div className="max-w-3xl mx-auto">
                            <TalentMatchQuiz talents={talents} quizState={quizState} setQuizState={setQuizState} onComplete={handleQuizComplete} onCapacityChange={setPricingFullTime} language={language} quizRef={quizRef} isQuizOpen={isQuizOpen} onCloseQuiz={() => setIsQuizOpen(false)} />
                        </div>

                        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                            <PricingTierBanner isFullTime={pricingFullTime} onToggleCapacity={setPricingFullTime} language={language} expanded={pricingExpanded} onToggleExpanded={() => setPricingExpanded(!pricingExpanded)} />

                            <FadeIn delay={200} className="mb-6 sm:mb-8">
                                <div className={`flex flex-col sm:flex-row gap-4 transition-opacity duration-500 ${!quizCompleted && isQuizOpen ? 'opacity-40 pointer-events-none' : 'opacity-100'}`}>
                                    <div className="relative flex-grow">
                                        <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-ink-light" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                                        <input type="text" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} placeholder={t.searchPlaceholder}
                                            className="w-full pl-11 pr-4 py-3 sm:py-3.5 glass-panel rounded-2xl focus:ring-2 focus:ring-pastel-lilac/30 transition-all duration-300 text-sm text-ink placeholder:text-ink-light" />
                                    </div>
                                    <div className="flex flex-wrap gap-2 sm:gap-2.5 overflow-x-auto pb-2 sm:pb-0 hide-scrollbar">
                                        {CATEGORIES.map(cat => (
                                            <button key={cat.id} onClick={() => setSelectedCategory(cat.id)}
                                                className={`px-4 py-2 sm:py-3 rounded-xl sm:rounded-2xl text-[11px] sm:text-xs font-medium transition-all duration-300 tracking-luxury whitespace-nowrap border ${
                                                    selectedCategory === cat.id ? 'bg-pastel-lilac border-pastel-lilac text-white shadow-soft' : 'glass-panel border-white/50 text-ink-muted hover:text-ink hover:bg-white/80'
                                                }`}>
                                                {cat.name}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </FadeIn>

                            {!loading && !error && filteredTalents.length > 0 && (
                                <FadeIn delay={100} className="mb-6 px-1">
                                    <p className="text-ink-muted text-xs sm:text-sm font-medium">
                                        <span className="text-pastel-lilac text-sm sm:text-base">{filteredTalents.length}</span> {t.resultsFound}
                                    </p>
                                </FadeIn>
                            )}

                            {loading && (
                                <div className="text-center py-20">
                                    <div className="w-10 h-10 rounded-xl shimmer-loader mx-auto mb-4" />
                                    <p className="text-ink-muted text-xs tracking-luxury uppercase">{t.loading}</p>
                                </div>
                            )}

                            {error && (
                                <div className="max-w-sm mx-auto text-center py-16">
                                    <div className="glass-panel rounded-3xl p-6 shadow-soft border border-pastel-blush">
                                        <p className="text-ink-muted text-sm mb-4">{error}</p>
                                        <button onClick={fetchTalents} className="bg-pastel-lilac text-white px-6 py-2 rounded-full text-xs font-medium">
                                            {t.retry}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {!loading && !error && filteredTalents.length === 0 && (
                                <div className="py-10">
                                    <ZeroResultsCTA language={language} onRequestCustom={handleCustomRequest} />
                                </div>
                            )}

                            {!loading && !error && filteredTalents.length > 0 && (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5 sm:gap-6">
                                    {filteredTalents.map((talent, index) => (
                                        <TalentCard key={talent.id} talent={talent} language={language} onRequestInterview={handleRequestInterview} isLocked={!quizCompleted && index >= (window.innerWidth < 640 ? 2 : 4)} index={index} onUnlockClick={openQuiz} />
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Shared Modal */}
                    {showModal && (
                        <div className="fixed inset-0 bg-ink/30 backdrop-blur-sm flex items-center justify-center p-4 z-50" onClick={() => setShowModal(false)}>
                            <div className="glass-panel rounded-[2rem] shadow-soft-lg max-w-md w-full p-6 sm:p-8 modal-enter border border-white" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h3 className="text-lg sm:text-xl font-semibold text-ink mb-1 tracking-tight">
                                            {modalMode === 'interview' ? t.scheduleInterview : t.customRequestTitle}
                                        </h3>
                                        {modalMode === 'interview' && selectedTalent && (
                                            <p className="text-ink-muted text-xs sm:text-sm">{selectedTalent.full_name} — {selectedTalent.role_type}</p>
                                        )}
                                        {modalMode === 'custom' && (
                                            <p className="text-ink-muted text-xs leading-relaxed max-w-sm">{language==='es'?'Describa el perfil exacto que busca.':'Describe the exact profile you are looking for.'}</p>
                                        )}
                                    </div>
                                    <button onClick={() => setShowModal(false)} className="w-8 h-8 rounded-full bg-white/60 hover:bg-white flex items-center justify-center text-ink-muted hover:text-pastel-rose transition-colors shrink-0">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                                    </button>
                                </div>

                                <form className="space-y-3.5" onSubmit={(e) => { e.preventDefault(); setShowModal(false); alert(language==='es'?'Solicitud enviada':'Request sent'); }}>
                                    <div><input type="text" required placeholder={language==='es'?'Su Nombre *':'Your Name *'} className="w-full px-4 py-3 bg-white/80 border border-white/50 rounded-xl focus:ring-2 focus:ring-pastel-lilac/30 text-sm" /></div>
                                    <div><input type="email" required placeholder={language==='es'?'Su Email Laboral *':'Work Email *'} className="w-full px-4 py-3 bg-white/80 border border-white/50 rounded-xl focus:ring-2 focus:ring-pastel-lilac/30 text-sm" /></div>
                                    <div>
                                        <textarea rows={modalMode==='custom'?4:3} required={modalMode==='custom'} placeholder={modalMode==='custom' ? (language==='es'?'Detalle habilidades, herramientas, zona horaria... *':'List skills, tools, timezone... *') : (language==='es'?'Mensaje (Opcional)':'Message (Optional)')} className="w-full px-4 py-3 bg-white/80 border border-white/50 rounded-xl focus:ring-2 focus:ring-pastel-lilac/30 text-sm resize-none" />
                                    </div>
                                    <div className="flex gap-2 pt-3">
                                        <button type="button" onClick={() => setShowModal(false)} className="flex-1 bg-white border border-white/50 text-ink-muted px-4 py-3 rounded-xl text-xs sm:text-sm font-medium hover:bg-pastel-lavender/30">{t.close}</button>
                                        <button type="submit" className="flex-[2] btn-premium text-white px-4 py-3 rounded-xl text-xs sm:text-sm font-semibold shadow-soft">{t.send}</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                    
                    <style dangerouslySetInnerHTML={{__html: `
                        .hide-scrollbar::-webkit-scrollbar { display: none; }
                        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
                        img[onerror] + .fallback-svg { display: none; }
                        img[onerror]:not([src]), img[onerror][src=""] { display: none; }
                        img[onerror]:not([src]) + .fallback-svg, img[onerror][src=""] + .fallback-svg { display: block; }
                    `}} />
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<TalentBench />);
    </script>
</body>
</html>
