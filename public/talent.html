  <body>
<div id="root"></div>

<!-- Private Access Modal for authenticated actions -->
<style>
.private-access-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}
.private-access-modal.active {
  display: flex;
}
.private-access-modal .modal-content {
  background: white;
  padding: 40px;
  border-radius: 12px;
  max-width: 500px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.private-access-modal .modal-content h2 {
  margin: 0 0 20px 0;
  color: #1a1a1a;
  font-size: 24px;
}
.private-access-modal .modal-content p {
  color: #555;
  font-size: 16px;
  line-height: 1.6;
  margin: 0;
}
.private-access-modal .close-btn {
  margin-top: 25px;
  padding: 12px 30px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}
.private-access-modal .close-btn:hover {
  background: #1d4ed8;
}
</style>

<div id="privateAccessModal" class="private-access-modal">
  <div class="modal-content">
    <h2>Private Access</h2>
    <p>Register to unlock shortlist, interviews, and your personalized portal. You can browse the full pool now. Once registered, all blur disappears and the private interview dashboard unlocks.</p>
    <button class="close-btn" onclick="closePrivateAccessModal()">Close</button>
  </div>
</div>

<script>
// Authentication check - check if user is logged in
function isUserLoggedIn() {
  // Check localStorage for auth token or user data
  const token = localStorage.getItem('authToken') || localStorage.getItem('token') || localStorage.getItem('user');
  const isLoggedIn = localStorage.getItem('isLoggedIn');
  const registered = localStorage.getItem('byp_lead_registered');
  return token || isLoggedIn === 'true' || registered === 'true';
}

// Show private access modal
function showPrivateAccessModal() {
  const modal = document.getElementById('privateAccessModal');
  if (modal) {
    modal.classList.add('active');
  }
}

// Close private access modal
function closePrivateAccessModal() {
  const modal = document.getElementById('privateAccessModal');
  if (modal) {
    modal.classList.remove('active');
  }
}

// Handle action button clicks
function handleActionButton(event) {
  if (!isUserLoggedIn()) {
    event.preventDefault();
    event.stopPropagation();
    showPrivateAccessModal();
    return false;
  }
  return true;
}

// Initialize on page load - attach handlers to action buttons after React renders
document.addEventListener('DOMContentLoaded', function() {
  // Look for buttons with Shortlist/Interview/Discard functionality
  setTimeout(function() {
    // Find all buttons that could be action buttons
    const buttons = document.querySelectorAll('button');
    const actionKeywords = ['shortlist', 'interview', 'discard', 'favorite', 'book'];
    
    buttons.forEach(function(btn) {
      const btnText = btn.textContent.toLowerCase();
      const hasActionKeyword = actionKeywords.some(function(keyword) {
        return btnText.includes(keyword);
      });
      
      if (hasActionKeyword) {
        // Add click handler
        btn.addEventListener('click', function(e) {
          if (!isUserLoggedIn()) {
            handleActionButton(e);
          }
        });
      }
    });
  }, 1500);
});

// Also use event delegation for dynamically added buttons
document.addEventListener('click', function(e) {
  const btn = e.target.closest('button');
  if (!btn) return;
  
  const btnText = btn.textContent.toLowerCase();
  const actionKeywords = ['shortlist', 'interview', 'discard', 'favorite', 'book'];
  
  const hasActionKeyword = actionKeywords.some(function(keyword) {
    return btnText.includes(keyword);
  });
  
  if (hasActionKeyword && !isUserLoggedIn()) {
    e.preventDefault();
    e.stopPropagation();
    showPrivateAccessModal();
  }
}, true);

  const quizObserver = new MutationObserver(() => {
    const quizBtn = Array.from(document.querySelectorAll('button')).find(btn => /Start Match Quiz|✨/i.test(btn.textContent || '') || /quiz/i.test(btn.className || ''));
    if (!quizBtn || quizBtn.dataset.quizBound === 'true') return;
    quizBtn.dataset.quizBound = 'true';
    
    quizBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      
      let quizSection = document.querySelector('.fade-visible, [class*="quiz"], [class*="Quiz"], [id*="quiz"], [id*="Quiz"]');
      
      if (!quizSection) {
        quizSection = document.createElement('div');
        quizSection.className = 'quiz-popup-overlay';
        quizSection.innerHTML = `
          <div class="quiz-popup-content">
            <button class="quiz-popup-close">&times;</button>
            <h2>Match Quiz</h2>
            <p>Quiz content will appear here. Please check back later.</p>
          </div>
        `;
        document.body.appendChild(quizSection);
      }
      
      quizSection.classList.remove('hidden');
      quizSection.classList.add('active', 'expanded');
      quizSection.style.display = 'flex';
      quizSection.style.position = 'fixed';
      quizSection.style.top = '0';
      quizSection.style.left = '0';
      quizSection.style.width = '100%';
      quizSection.style.height = '100%';
      quizSection.style.zIndex = '99999';
      quizSection.style.backgroundColor = 'rgba(0,0,0,0.8)';
      quizSection.style.justifyContent = 'center';
      quizSection.style.alignItems = 'center';
      
      const closeBtn = quizSection.querySelector('.quiz-popup-close');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          quizSection.style.display = 'none';
        });
      }
      
      quizSection.addEventListener('click', (e) => {
        if (e.target === quizSection) {
          quizSection.style.display = 'none';
        }
      });
    });
  });
  quizObserver.observe(document.body, { childList: true, subtree: true });
</script>

  </body>
</html>
