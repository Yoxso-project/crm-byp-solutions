            specialized: { bg: 'bg-pastel-lavender', border: 'border-pastel-lilac/20', accent: 'text-pastel-lilac' },
            ai: { bg: 'bg-pastel-sky', border: 'border-pastel-azure/20', accent: 'text-pastel-azure' },
            elite: { bg: 'bg-pastel-peach', border: 'border-orange-300/30', accent: 'text-orange-400' },
        };

        function AmbientBackground() {
            return (
                <div className="fixed inset-0 overflow-hidden pointer-events-none z-0" aria-hidden="true">
                    <div className="orb w-[420px] h-[420px] bg-pastel-lavender -top-32 -left-24 animate-float" />
                    <div className="orb w-[360px] h-[360px] bg-pastel-mint top-1/3 -right-20 animate-float-delayed" />
                    <div className="orb w-[280px] h-[280px] bg-pastel-blush bottom-20 left-1/4 animate-float" style={{ animationDelay: '1.5s' }} />
                    <div className="orb w-[200px] h-[200px] bg-pastel-sky bottom-40 right-1/3 animate-float-delayed" />
                </div>
            );
        }

        function FadeIn({ children, delay = 0, className = '' }) {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                const observer = new IntersectionObserver(
                    ([entry]) => { if (entry.isIntersecting) { setVisible(true); observer.disconnect(); } },
                    { threshold: 0.08, rootMargin: '0px 0px -40px 0px' }
                );
                observer.observe(el);
                return () => observer.disconnect();
            }, []);
            return (
                <div
                    ref={ref}
                    className={`${visible ? 'fade-visible' : 'fade-hidden'} ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        }

        function TrustStrip({ language }) {
            const items = language === 'es'
                ? ['100% Verificados', 'Bilingües EN/ES', 'Agencia Gestionada', 'Despliegue en 48h']

                            <span className="w-1.5 h-1.5 rounded-full bg-pastel-sage status-dot" />

        }

        function LeadHero({ language, onStartQuiz, quizCompleted }) {
            const t = language === 'es' ? {
                eyebrow: 'Sin compromiso · 60 segundos',

            } : {
                eyebrow: 'No commitment · 60 seconds',
                title: 'Find your perfect specialist',
                subtitle: 'Not sure where to start? Answer 4 simple questions and we\'ll match you with the right team for your business — no expertise required.',
                cta: 'Start Match Quiz',
                skip: 'Browse featured profiles below',
            };

            if (quizCompleted) return null;

            return (
                <FadeIn className="text-center mb-10">
                    <p className="text-xs font-semibold text-pastel-lilac tracking-widest uppercase mb-3">{t.eyebrow}</p>
                    <h2 className="text-2xl sm:text-3xl font-semibold text-ink mb-3 tracking-tight">
                        {t.title.split(' ').slice(0, -2).join(' ')}{' '}
                        <span className="gradient-text">{t.title.split(' ').slice(-2).join(' ')}</span>
                    </h2>
                    <p className="text-ink-muted max-w-xl mx-auto text-sm sm:text-base leading-relaxed mb-6">
                        {t.subtitle}
                    </p>
                    <button
                        onClick={onStartQuiz}
                        className="btn-premium text-white px-8 py-3.5 rounded-full font-semibold text-sm tracking-luxury shadow-soft-lg"
                    >
                        {t.cta}
                    </button>
                    <p className="text-ink-light text-xs mt-4 tracking-wide">{t.skip}</p>
                </FadeIn>
            );
        }

        function formatRate(rate) {
            return rate.toFixed(2);
        }

        function applyDiscount(rate, isFullTime) {
            return isFullTime ? rate * 0.9 : rate;
        }

        function talentMatchesTools(talent, selectedTools) {
            if (!selectedTools || selectedTools.length === 0) return true;
            const haystack = [
                talent.role_type,
                talent.summary,
                ...(Array.isArray(talent.tags) ? talent.tags : []),
                ...(Array.isArray(talent.skills) ? talent.skills : []),
            ].join(' ').toLowerCase();

            return selectedTools.some(toolId => {
                const tool = QUIZ_TOOLS.find(t => t.id === toolId);
                if (!tool) return false;
                return tool.keywords.some(kw => haystack.includes(kw));
            });
        }

        function talentMatchesBottleneck(talent, bottleneckId) {
            if (!bottleneckId) return true;
            const bottleneck = QUIZ_BOTTLENECKS.find(b => b.id === bottleneckId);
            if (!bottleneck) return true;
            return bottleneck.categories.includes(talent.category_id);
        }

        function isAvailableWithin48Hours(talent) {
            const tags = Array.isArray(talent.tags) ? talent.tags : [];
            const tagMatch = tags.some(tag =>
                String(tag).toLowerCase().includes('48') ||
                String(tag).toLowerCase().includes('available') ||
                String(tag).toLowerCase() === 'available_48h'
            );
            if (tagMatch) return true;
            if (talent.available_within_48h === true) return true;
            const status = String(talent.availability_status || '').toLowerCase();
            return status.includes('48') || status === 'available';
        }

                retainer: 'Prepaid retainer locks in your dedicated specialist.',
                includes: 'Dedicated hours, QA management, monitoring & instant backup.',
                perHour: '/hr',
                expand: 'View hourly rates',
                collapse: 'Hide rates',
                from: 'From',
                tooltip: 'Hourly rate covers execution time only. Software subscriptions and API keys are billed separately.',
            };

            const lowestRate = applyDiscount(PRICING_TIERS[0].rate, isFullTime);

            return (
                <FadeIn delay={120} className="pricing-sticky mb-8">

                                    <svg className="w-5 h-5 text-pastel-lilac" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                </div>
                                <div>
                                    <h2 className="text-base sm:text-lg font-semibold text-ink tracking-tight">{t.title}</h2>
                                    <p className="text-xs text-ink-muted tracking-luxury mt-0.5">
                                        {t.subtitle} · <span className="text-pastel-lilac font-medium">{t.from} ${formatRate(lowestRate)}{t.perHour}</span>
                                    </p>
                                </div>
                            </div>
                            <div className="flex items-center gap-2 text-xs font-medium text-pastel-lilac tracking-wide flex-shrink-0">
                                <span className="hidden sm:inline">{expanded ? t.collapse : t.expand}</span>

        function TalentMatchQuiz({ talents, quizState, setQuizState, onComplete, onCapacityChange, language, quizRef }) {

            const t = language === 'es' ? {
                title: 'Quiz de Coincidencia',

                            <div className="flip-card-front shadow-card border border-white/90 p-6 flex flex-col">
                                {renderPhotoArea()}

                                <div className="text-center mb-3">
                                    <div className="flex items-center justify-center gap-2 flex-wrap mb-1">
                                        <h3 className="text-lg font-semibold text-ink tracking-tight">{talent.full_name}</h3>
                                    </div>
                                    <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[10px] font-medium tracking-luxury uppercase ${
                                        available48h
                                            ? 'bg-pastel-mint text-pastel-sage'
                                            : 'bg-pastel-peach text-orange-400/80'

                                        {available48h ? t.available48 : t.onStandby}

                                </div>

                                <div className="flex-grow mb-4">
                                    <p className="text-ink-muted text-sm leading-relaxed line-clamp-4">
                                        {talent.summary}
                                    </p>
                                </div>

                                <div className="mb-4 space-y-2">
                                    {talent.experience && talent.experience.length > 0 && (
                                        <div className="flex items-center text-sm text-ink-muted">
                                            <svg className="w-4 h-4 text-pastel-sage mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                                            </svg>
                                            <span>{talent.experience.length}+ years of experience</span>
                                        </div>
                                    )}
                                    <div className="flex items-center text-sm text-ink-muted">
                                        <svg className="w-4 h-4 text-pastel-sage mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                            <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                                        </svg>
                                        <span>Bilingual (English/Spanish)</span>
                                    </div>
                                </div>

                                <div className="pt-4 border-t border-white/80 space-y-3">
                                    <div className="text-center">
                                        <span className="text-[10px] font-medium text-ink-light tracking-widest uppercase">{t.agencyManaged}</span>
                                    </div>
                                    <div className="flex gap-2">
                                        {hasMedia && (
                                            <button
                                                onClick={handleMediaIntro}
                                                className="no-flip flex-1 text-pastel-lilac hover:text-brand-800 text-sm font-medium flex items-center justify-center py-2.5 border border-pastel-lilac/20 rounded-full hover:bg-pastel-lavender/50 transition-all duration-300"
                                            >
                                                <svg className="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                </svg>
                                                {t.viewIntro}
                                            </button>
                                        )}
                                        <button
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                onRequestInterview(talent);
                                            }}
                                            className="no-flip flex-1 bg-pastel-sage hover:opacity-90 text-white px-4 py-2.5 rounded-full font-medium transition-all duration-300 shadow-soft flex items-center justify-center text-sm"
                                        >
                                            {t.requestInterview}
                                            <svg className="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7l5 5m0 0l-5 5m5-5H6" />
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <div className="text-center mt-3">
                                    <button
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            setIsFlipped(true);
                                        }}
                                        className="no-flip text-xs text-pastel-lilac hover:text-brand-800 font-medium tracking-wide transition-all duration-300"
                                    >
                                        {t.viewPortfolio}
                                    </button>
                                </div>
                            </div>

                            {/* Back */}
                            <div className="flip-card-back shadow-card border border-white/90 p-6 overflow-y-auto">
                                <div className="text-center mb-4">
                                    <h3 className="text-lg font-semibold text-ink">{talent.full_name}</h3>
                                    <p className="text-pastel-lilac font-medium text-sm">{talent.role_type}</p>
                                </div>

                                {talent.experience && talent.experience.length > 0 && (
                                    <div className="mb-4">
                                        <h4 className="text-xs font-semibold text-ink-muted mb-2 flex items-center tracking-widest uppercase">
                                            <svg className="w-4 h-4 text-pastel-lilac mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                                            </svg>
                                            {t.experience}
                                        </h4>
                                        <div className="space-y-2">
                                            {talent.experience.map((exp, idx) => (
                                                <div key={idx} className="bg-pastel-lavender/40 p-3 rounded-2xl">
                                                    <div className="font-medium text-sm text-ink">{exp.role}</div>
                                                    <div className="text-xs text-ink-muted">{exp.company}</div>
                                                    <div className="text-xs text-ink-light">{exp.duration}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {talent.education && talent.education.length > 0 && (
                                    <div className="mb-2">
                                        <h4 className="text-xs font-semibold text-ink-muted mb-2 flex items-center tracking-widest uppercase">
                                            <svg className="w-4 h-4 text-pastel-lilac mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                                            </svg>
                                            {t.education}
                                        </h4>
                                        <div className="space-y-2">
                                            {talent.education.map((edu, idx) => (
                                                <div key={idx} className="bg-pastel-mint/40 p-3 rounded-2xl">
                                                    <div className="font-medium text-sm text-ink">{edu.degree}</div>
                                                    <div className="text-xs text-ink-muted">{edu.institution}</div>
                                                    <div className="text-xs text-ink-light">{edu.year}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <InstantBookingFlow talent={talent} language={language} />

                                <div className="text-center mt-3">
                                    <button
                                        onClick={(e) => {
                                            e.stopPropagation();
                                            setIsFlipped(false);
                                        }}
                                        className="no-flip text-xs text-ink-light hover:text-pastel-lilac font-medium tracking-wide transition-all duration-300"
                                    >
                                        ← {language === 'es' ? 'Volver' : 'Back to profile'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {isLocked && (
                        <div className="absolute inset-0 z-10 rounded-3xl flex items-center justify-center cursor-pointer" onClick={onUnlockClick}>
                            <div className="absolute inset-0 rounded-3xl bg-white/40" style={{ backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)' }} />
                            <div className="relative z-20 mx-6 text-center glass-panel rounded-3xl p-6 shadow-soft-lg max-w-xs pointer-events-auto animate-scale-in">
                                <div className="w-11 h-11 rounded-2xl bg-pastel-lavender flex items-center justify-center mx-auto mb-3">
                                    <svg className="w-5 h-5 text-pastel-lilac" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                                    </svg>
                                </div>
                                <p className="text-sm text-ink-muted leading-relaxed mb-4">{t.unlockMsg}</p>
                                <span className="inline-block btn-premium text-white text-xs font-semibold px-5 py-2 rounded-full tracking-luxury">
                                    {t.unlockCta}
                                </span>
                            </div>
                        </div>
                    )}
                </FadeIn>
            );
        }

        function TalentBench() {
            const [talents, setTalents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState('');
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('all');
            const [language, setLanguage] = useState('en');
            const [showInterviewModal, setShowInterviewModal] = useState(false);
            const [selectedTalent, setSelectedTalent] = useState(null);
            const [quizCompleted, setQuizCompleted] = useState(false);
            const [pricingFullTime, setPricingFullTime] = useState(false);
            const [quizState, setQuizState] = useState({
                step: 1,
                bottleneck: '',
                capacity: '',
                tools: [],
                leadForm: { firstName: '', email: '', phone: '' },
                isCollapsed: false,
            });
            const [quizFilters, setQuizFilters] = useState(null);
            const [pricingExpanded, setPricingExpanded] = useState(false);
            const quizRef = useRef(null);

            const scrollToQuiz = useCallback(() => {
                quizRef.current?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, []);

            useEffect(() => {
                fetchTalents();
            }, []);

            const fetchTalents = async () => {
                setLoading(true);
                setError('');

                try {
                    const { data, error: supabaseError } = await supabase
                        .from('public_talent_bench')
                        .select('*')
                        .order('full_name', { ascending: true });

                    if (supabaseError) throw supabaseError;

                    setTalents(data || []);
                } catch (err) {
                    console.error('Error fetching talents:', err);
                    setError('Failed to load talent data. Please try again later.');
                } finally {
                    setLoading(false);
                }
            };

            const handleQuizComplete = useCallback((data) => {
                setQuizCompleted(true);
                setQuizFilters(data);
                if (data.capacity === 'fulltime') {
                    setPricingFullTime(true);
                }
            }, []);

            const filteredTalents = useMemo(() => {
                return talents.filter(talent => {
                    const matchesSearch =
                        talent.full_name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        talent.role_type.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        talent.summary.toLowerCase().includes(searchTerm.toLowerCase());

                    const matchesCategory = selectedCategory === 'all' || talent.category_id === selectedCategory;

                    let matchesQuiz = true;
                    if (quizCompleted && quizFilters) {
                        matchesQuiz =
                            talentMatchesBottleneck(talent, quizFilters.bottleneck) &&
                            talentMatchesTools(talent, quizFilters.tools);
                    }

                    return matchesSearch && matchesCategory && matchesQuiz;
                });
            }, [talents, searchTerm, selectedCategory, quizCompleted, quizFilters]);

            const handleRequestInterview = (talent) => {
                setSelectedTalent(talent);
                setShowInterviewModal(true);
            };

            const t = language === 'es' ? {
                title: 'Talent Bench',
                subtitle: 'Especialistas verificados, listos para desplegar en su negocio',
                searchPlaceholder: 'Buscar por nombre o rol...',
                resultsFound: 'especialistas premium encontrados',
                loading: 'Cargando talento...',
                error: 'Error',
                retry: 'Reintentar',
                noResults: 'No se encontró talento',
                tryAdjusting: 'Intenta ajustar tu búsqueda o filtros',
                scheduleInterview: 'Programar Entrevista',
                close: 'Cerrar',
                contactInfo: 'Información de Contacto',
                yourName: 'Tu Nombre',
                yourEmail: 'Tu Email',
                yourPhone: 'Teléfono (Opcional)',
                message: 'Mensaje (Opcional)',
                send: 'Enviar Solicitud',
            } : {
                title: 'Talent Bench',
                subtitle: 'Vetted specialists, ready to deploy into your business',
                searchPlaceholder: 'Search by name or role...',
                resultsFound: 'premium specialists found',
                loading: 'Loading talent...',
                error: 'Error',
                retry: 'Retry',
                noResults: 'No talent found',
                tryAdjusting: 'Try adjusting your search or filters',
                scheduleInterview: 'Schedule Interview',
                close: 'Close',
                contactInfo: 'Contact Information',
                yourName: 'Your Name',
                yourEmail: 'Your Email',
                yourPhone: 'Phone Number (Optional)',
                message: 'Message (Optional)',
                send: 'Send Request',
            };

            return (
                <div className="min-h-screen bg-cream relative">
                    <AmbientBackground />

                    <header className="glass-panel sticky top-0 z-40 border-b border-white/60">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex items-center justify-between">
                                <a href="/" className="flex items-center gap-2.5 group">
                                    <div className="w-9 h-9 rounded-xl bg-pastel-lavender flex items-center justify-center transition-transform duration-300 group-hover:scale-105">
                                        <svg className="w-5 h-5 text-pastel-lilac" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                                        </svg>
                                    </div>
                                    <span className="text-lg font-semibold text-ink tracking-tight">ByP Solutions</span>
                                </a>

                                <div className="flex items-center bg-pastel-lavender/50 rounded-full p-0.5">
                                    {['en', 'es'].map(lang => (
                                        <button key={lang} onClick={() => setLanguage(lang)}
                                            className={`px-3.5 py-1.5 rounded-full text-xs font-medium transition-all duration-300 tracking-luxury uppercase ${
                                                language === lang ? 'bg-white text-pastel-lilac shadow-soft' : 'text-ink-muted hover:text-ink'
                                            }`}>
                                            {lang}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="relative z-10 max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-14">
                        <FadeIn className="text-center mb-6">
                            <h1 className="text-3xl sm:text-4xl font-semibold text-ink tracking-tight mb-2">
                                {t.title.split(' ')[0]}{' '}
                                <span className="gradient-text">{t.title.split(' ').slice(1).join(' ') || 'Bench'}</span>
                            </h1>
                            <p className="text-ink-muted text-sm sm:text-base max-w-md mx-auto leading-relaxed">{t.subtitle}</p>
                        </FadeIn>

                        <TrustStrip language={language} />

                        <LeadHero language={language} onStartQuiz={scrollToQuiz} quizCompleted={quizCompleted} />

                        <TalentMatchQuiz
                            talents={talents}
                            quizState={quizState}
                            setQuizState={setQuizState}
                            onComplete={handleQuizComplete}
                            onCapacityChange={setPricingFullTime}
                            language={language}
                            quizRef={quizRef}
                        />

                        <PricingTierBanner
                            isFullTime={pricingFullTime}
                            onToggleCapacity={setPricingFullTime}
                            language={language}
                            expanded={pricingExpanded}
                            onToggleExpanded={() => setPricingExpanded(!pricingExpanded)}
                        />

                        <FadeIn delay={200}>
                            <div className={`mb-6 transition-opacity duration-500 ${!quizCompleted ? 'opacity-60' : 'opacity-100'}`}>
                                <div className="relative">
                                    <svg className="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-ink-light" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                                    </svg>
                                    <input
                                        type="text"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        placeholder={t.searchPlaceholder}
                                        className="w-full pl-11 pr-4 py-3.5 glass-panel rounded-2xl focus:ring-2 focus:ring-pastel-lilac/20 transition-all duration-300 text-sm text-ink placeholder:text-ink-light"
                                    />
                                </div>
                            </div>

                            <div className={`flex flex-wrap gap-2 mb-8 transition-opacity duration-500 ${!quizCompleted ? 'opacity-60' : 'opacity-100'}`}>
                                {CATEGORIES.map(cat => (
                                    <button key={cat.id} onClick={() => setSelectedCategory(cat.id)}
                                        className={`px-4 py-2 rounded-full text-xs font-medium transition-all duration-300 tracking-luxury ${
                                            selectedCategory === cat.id
                                                ? 'gradient-badge text-white shadow-soft'
                                                : 'glass-panel text-ink-muted hover:text-ink hover:shadow-soft'
                                        }`}>
                                        {cat.name}
                                    </button>
                                ))}
                            </div>
                        </FadeIn>

                        {!loading && !error && (
                            <FadeIn delay={100} className="mb-8 text-center">
                                <p className="text-ink-muted text-sm">
                                    <span className="font-semibold text-pastel-lilac text-lg">{filteredTalents.length}</span>{' '}
                                    {t.resultsFound}
                                </p>
                            </FadeIn>
                        )}

                        {loading && (
                            <div className="text-center py-24">
                                <div className="w-12 h-12 rounded-2xl shimmer-loader mx-auto mb-4" />
                                <p className="text-ink-muted text-sm tracking-luxury">{t.loading}</p>
                            </div>
                        )}

                        {error && (
                            <div className="max-w-md mx-auto text-center py-20">
                                <div className="glass-panel rounded-3xl p-8 shadow-soft-lg border border-pastel-blush">
                                    <div className="w-12 h-12 rounded-2xl bg-pastel-blush flex items-center justify-center mx-auto mb-4">
                                        <svg className="w-6 h-6 text-pastel-rose" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                        </svg>
                                    </div>
                                    <h3 className="text-base font-semibold text-ink mb-2">{t.error}</h3>
                                    <p className="text-ink-muted text-sm mb-5">{error}</p>
                                    <button onClick={fetchTalents}
                                        className="bg-pastel-lilac hover:opacity-90 text-white px-6 py-2.5 rounded-full text-sm font-medium transition-all duration-300">
                                        {t.retry}
                                    </button>
                                </div>
                            </div>
                        )}

                        {!loading && !error && filteredTalents.length === 0 && (
                            <div className="text-center py-20">
                                <div className="w-16 h-16 rounded-3xl bg-pastel-lavender flex items-center justify-center mx-auto mb-4">
                                    <svg className="w-8 h-8 text-pastel-lilac/60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                </div>
                                <h3 className="text-lg font-semibold text-ink mb-2">{t.noResults}</h3>
                                <p className="text-ink-muted text-sm">{t.tryAdjusting}</p>
                            </div>
                        )}

                        {!loading && !error && filteredTalents.length > 0 && (
                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                                {filteredTalents.map((talent, index) => (
                                    <TalentCard
                                        key={talent.id}
                                        talent={talent}
                                        language={language}
                                        onRequestInterview={handleRequestInterview}
                                        isLocked={!quizCompleted && index >= 3}
                                        index={index}
                                        onUnlockClick={scrollToQuiz}
                                    />
                                ))}
                            </div>
                        )}
                    </div>

                    {showInterviewModal && selectedTalent && (
                        <div className="fixed inset-0 bg-ink/20 backdrop-blur-md flex items-center justify-center p-4 z-50" onClick={() => setShowInterviewModal(false)}>
                            <div className="glass-panel rounded-3xl shadow-soft-lg max-w-lg w-full p-8 modal-enter" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h3 className="text-xl font-semibold text-ink mb-1 tracking-tight">{t.scheduleInterview}</h3>
                                        <p className="text-ink-muted text-sm">{selectedTalent.full_name} — {selectedTalent.role_type}</p>
                                    </div>
                                    <button onClick={() => setShowInterviewModal(false)}
                                        className="w-8 h-8 rounded-full bg-pastel-lavender/50 flex items-center justify-center text-ink-muted hover:text-ink transition-all duration-300">
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>

                                <form className="space-y-4" onSubmit={(e) => { e.preventDefault(); setShowInterviewModal(false); }}>
                                    {[
                                        { label: `${t.yourName} *`, type: 'text', placeholder: 'John Doe' },
                                        { label: `${t.yourEmail} *`, type: 'email', placeholder: 'john@company.com' },
                                        { label: t.yourPhone, type: 'tel', placeholder: '+1 (555) 123-4567' },
                                    ].map(field => (
                                        <div key={field.label}>
                                            <label className="block text-[10px] font-semibold text-ink-muted mb-1.5 tracking-widest uppercase">{field.label}</label>
                                            <input type={field.type} required={field.label.includes('*')}
                                                className="w-full px-4 py-3 bg-white/70 border border-white rounded-2xl focus:ring-2 focus:ring-pastel-lilac/30 transition-all duration-300 text-sm"
                                                placeholder={field.placeholder} />
                                        </div>
                                    ))}
                                    <div>
                                        <label className="block text-[10px] font-semibold text-ink-muted mb-1.5 tracking-widest uppercase">{t.message}</label>
                                        <textarea rows={3}
                                            className="w-full px-4 py-3 bg-white/70 border border-white rounded-2xl focus:ring-2 focus:ring-pastel-lilac/30 transition-all duration-300 text-sm"
                                            placeholder="Tell us about your needs..." />
                                    </div>
                                    <div className="flex gap-3 pt-2">
                                        <button type="button" onClick={() => setShowInterviewModal(false)}
                                            className="flex-1 glass-panel text-ink-muted px-6 py-3 rounded-full text-sm font-medium transition-all duration-300 hover:shadow-soft">
                                            {t.close}
                                        </button>
                                        <button type="submit"
                                            className="flex-1 btn-premium text-white px-6 py-3 rounded-full text-sm font-semibold shadow-soft">
                                            {t.send}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<TalentBench />, document.getElementById('root'));
    </script>
</body>
</html>
